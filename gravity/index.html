const c=document.querySelector('#c'),x=c.getContext('2d'),btn=document.querySelector('#btn'),msg=document.querySelector('#message'),lvl=document.querySelector('#lvl'),clock=document.querySelector('#clock');let W,H,D,ground,goal,level=1,time=0,blocks=[],moving=null,gravity=0,drag=false,mode='ready',last=0,anim=0,batch=0,dropTimer=0;const themes=[['#142d32','#438365'],['#432b54','#f3a468'],['#10172d','#426ca1'],['#28415d','#b8e4f3'],['#431b24','#ee7043'],['#090e26','#5958aa'],['#2b1d48','#ac73b8']],colors=['#f2b65e','#70c6bc','#bc9bea','#ee8c99','#7ebcf1','#e8d27b'];function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);ground=H*.76;goal=H*.25}addEventListener('resize',size);size();function spawn(){let w=Math.max(13,Math.min(115,W*.27)-level*4.5+(Math.random()-.5)*12),h=Math.max(16,H*.032);let fromLeft=Math.random()<.5;moving={x:fromLeft?-w:W+w,y:ground-(blocks.length+1)*(h+2),w,h,v:(fromLeft?1:-1)*(125+level*42+Math.max(0,level-14)*48+Math.max(0,level-19)*210),color:colors[blocks.length%6]}}function randomStartingGravity(){const angle=(3+Math.random()*12)*(Math.random()<.5?-1:1)*Math.PI/180;return Math.max(-1,Math.min(1,Math.tan(angle)*(H*.11)/(W*.39)))}function beginBatch(){batch=0;dropTimer=0;mode='play';msg.textContent='';btn.style.display='none';moving=null}function stage(){blocks=[];moving=null;gravity=randomStartingGravity();mode='ready';lvl.textContent='Bane '+level+' · ∞';msg.innerHTML='Bane '+level+'<br><small>Bygg et stabilt tårn!</small>';btn.textContent='START';btn.style.display='block'}function action(){if(mode==='ready'||mode==='fallen'){blocks=[];gravity=randomStartingGravity();beginBatch()}else if(mode==='error'){return}}function advance(){if(mode!=='play')return;level++;blocks=[];moving=null;dropTimer=.13;gravity=randomStartingGravity();lvl.textContent='Bane '+level+' · ∞';if(level===23){mode='error';msg.innerHTML='SYNTAX ERROR.<br><small>Turn of your phone</small>';btn.style.display='none';return}msg.textContent='BANE '+level;setTimeout(()=>{if(mode==='play')msg.textContent=''},750)} btn.onclick=e=>{e.stopPropagation();action()};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(mode==='play')placeBlock();else action()}if(e.code==='ArrowLeft')gravity=Math.max(-1,gravity-.12);if(e.code==='ArrowRight')gravity=Math.min(1,gravity+.12)});function setG(px){gravity=Math.max(-1,Math.min(1,(px-W/2)/(W*.39)))}c.onpointerdown=e=>{if(e.clientY>H*.78){e.preventDefault();drag=true;c.setPointerCapture(e.pointerId);setG(e.clientX)}else if(mode==='play'&&moving)placeBlock()};c.onpointermove=e=>{if(drag)setG(e.clientX)};c.onpointerup=()=>drag=false;function placeBlock(){if(mode!=='play'||!moving)return;blocks.push({...moving,a:0,spin:0});moving=null;batch++;dropTimer=.10;if(blocks.at(-1).y<=goal+10)advance()}function rect(cx,cy,w,h,color){x.fillStyle=color;x.fillRect(cx-w/2,cy,w,h)}function frame(t){let dt=Math.min((t-last)/1000||0,.035);last=t;if(mode==='play'){time+=dt;if(mode==='play'){dropTimer-=dt;if(!moving&&dropTimer<=0)spawn();if(moving){moving.x+=moving.v*dt;if(moving.x<-moving.w||moving.x>W+moving.w)moving.v*=-1;}}// Each block has inertia. Adjacent blocks share support and can arrest a fall.
for(let i=0;i<blocks.length;i++){
 const b=blocks[i],below=blocks[i-1],above=blocks[i+1];
 const baseX=below?below.x:b.x,baseW=below?below.w:W;
 const offset=below?b.x-baseX:0;
