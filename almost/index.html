<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121629"><title>ALMOST! · Lompack</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#121629;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}body{display:flex;flex-direction:column;align-items:center}header{width:min(900px,100%);display:flex;align-items:center;justify-content:space-between;padding:9px 15px;gap:12px}header a{color:#a6e3e9;text-decoration:none;font-size:14px}header strong{font-size:24px;letter-spacing:3px}header button{background:#293450;color:#fff;border:1px solid #6a789d;border-radius:10px;padding:8px 12px}.game{position:relative;flex:1;min-height:0;width:min(900px,100%);display:flex;align-items:center;justify-content:center;padding:8px}canvas{display:block;width:100%;max-height:100%;aspect-ratio:16/9;image-rendering:pixelated;touch-action:none;background:#202743;border-radius:12px;box-shadow:0 10px 30px #0006}.hud{position:absolute;top:15px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:14px;font-weight:800;pointer-events:none;text-shadow:0 2px 4px #0008}.hint{width:min(900px,100%);padding:10px 14px 16px;text-align:center;color:#c8cce3;font-size:13px}.overlay{position:absolute;inset:8px;display:grid;place-items:center;background:#11172acb;border-radius:12px;text-align:center;padding:16px}.overlay.hidden{display:none}.panel{max-width:450px}.panel h1{font-size:clamp(38px,9vw,76px);margin:0 0 5px;letter-spacing:3px;color:#ffdf80}.panel p{font-size:clamp(14px,3vw,19px);line-height:1.5}.panel button{background:#fbe18a;color:#20243a;border:0;border-radius:15px;font-weight:900;padding:14px 32px;font-size:20px;box-shadow:0 5px 0 #bc9750}.tiny{font-size:12px;color:#c5c8d9}.progress{position:absolute;bottom:18px;left:18px;right:18px;height:5px;background:#ffffff35;border-radius:8px;overflow:hidden;pointer-events:none}.progress>div{height:100%;width:0;background:#ffe08b;transition:width .05s linear}@media(max-height:490px){header{padding:3px 12px}.hint{padding:2px 8px 5px}.hud{top:12px}}
</style></head><body><header><a href="../">← LOMPACK</a><strong>ALMOST!</strong><button id="sound">♫ ON</button></header><div class="game" id="surface"><canvas id="screen" width="800" height="450"></canvas><div class="hud"><span id="level">LEVEL 01</span><span id="tries">ATTEMPTS 0</span><span id="best">BEST 0%</span></div><div class="progress"><div id="bar"></div></div><div class="overlay" id="overlay"><div class="panel"><h1 id="headline">ALMOST!</h1><p id="message">ONE BUTTON. ONE JUMP.<br>How hard can it be?</p><button id="go">LET'S GO</button><p class="tiny">Tap anywhere or press SPACE · Tap once per jump<br>Every obstacle is beatable. Every retry is instant.</p></div></div></div><div class="hint" id="hint">TAP ANYWHERE TO JUMP · SPACE / ↑ ON KEYBOARD</div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('screen'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const W=800,H=450,G=365,px=135,PW=30,PH=36,gravity=.82,jumpSpeed=-14.3,speed=5.25;let level=1,tries=0,best=0,state='intro',x=0,py=G-PH,vy=0,grounded=true,blocks=[],finish=0,flash=0,particles=[],shake=0,queued=false,musicOn=true,ac=null,tick=0,dieAt=0,autoAt=0;
function sound(f,d=.08,shape='square',vol=.035,down=0){if(!musicOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),v=ac.createGain(),t=ac.currentTime;o.type=shape;o.frequency.setValueAtTime(f,t);if(down)o.frequency.exponentialRampToValueAtTime(down,t+d);v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function build(){const rand=rng(level*12821+491);blocks=[];let pos=390;const count=Math.min(9,4+Math.floor((level-1)/2));for(let i=0;i<count;i++){const style=level>=5&&i%5===4?'double':level>=3&&i%3===2?'tall':'spike';let width=style==='double'?57:style==='tall'?31:34,height=style==='tall'?60:style==='double'?31:37;blocks.push({x:pos,w:width,h:height,style});pos+=width+205+Math.floor(rand()*60)}finish=pos+160}
function setHud(){$('level').textContent='LEVEL '+String(level).padStart(2,'0');$('tries').textContent='ATTEMPTS '+tries;$('best').textContent='BEST '+best+'%'}
function reset(){build();x=0;py=G-PH;vy=0;grounded=true;flash=0;particles=[];shake=0;tries++;state='running';setHud();$('overlay').classList.add('hidden');$('hint').textContent='TAP TO JUMP · LEARN THE RHYTHM'}
function show(title,message,button,fn){state='menu';$('headline').textContent=title;$('message').innerHTML=message;$('go').textContent=button;$('overlay').classList.remove('hidden');$('go').onclick=e=>{e.stopPropagation();fn()}}
function jump(){if(state==='intro'||state==='menu'){if(state==='intro')reset();else $('go').click();return}if(state!=='running')return;if(grounded){grounded=false;vy=jumpSpeed;sound(520,.095,'triangle',.04,230);for(let i=0;i<7;i++)particles.push({x:px+PW/2,y:G,vx:(Math.random()-.5)*4,vy:-Math.random()*3,life:15})}}
function crash(){if(state!=='running')return;state='dead';dieAt=performance.now();autoAt=dieAt+650;shake=11;flash=14;best=Math.max(best,Math.min(99,Math.floor(x/finish*100)));setHud();sound(180,.28,'sawtooth',.06,55);$('hint').textContent=(Math.min(99,Math.floor(x/finish*100))>=95?'99% — ALMOST!':'OUCH!')+' · TAP TO RETRY';for(let i=0;i<18;i++)particles.push({x:px+PW/2,y:py+PH/2,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*9,life:24})}
function win(){state='won';best=100;setHud();sound(660,.18,'triangle',.04);setTimeout(()=>sound(880,.22,'triangle',.04),120);show('YOU DID IT!','Level '+level+' complete!<br>'+tries+' attempts so far.<br><strong>Ready for a harder one?</strong>','NEXT LEVEL',()=>{level++;best=0;reset()})}
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(){tick++;if(state==='dead'&&performance.now()>=autoAt){reset();return}if(state==='running'){x+=speed;vy+=gravity;let next=py+vy;if(next>=G-PH){next=G-PH;vy=0;grounded=true}py=next;for(const b of blocks){let sx=b.x-x+px;if(sx>px+PW+10||sx+b.w<px-10)continue;if(collide({x:px+6,y:py+5,w:PW-12,h:PH-7},{x:sx+3,y:G-b.h+5,w:b.w-6,h:b.h-5})){crash();break}}if(x>=finish)win();$('bar').style.width=Math.min(100,x/finish*100)+'%'}if(flash>0)flash--;if(shake>0)shake--;for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.life--}particles=particles.filter(p=>p.life>0)}
function box(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function draw(){ctx.save();ctx.translate(shake?(Math.random()-.5)*shake:0,shake?(Math.random()-.5)*shake:0);box(0,0,W,H,'#1b2541');const par=x*.15;for(let i=-1;i<9;i++){let mx=((i*150-par%150)+800)%950-80;box(mx,125+(i%3)*24,100,200,'#253557');box(mx+28,145+(i%3)*24,40,180,'#2d4064')}box(0,G,W,H-G,'#293a50');box(0,G,W,7,'#78c7b5');for(let i=0;i<25;i++){let tx=((i*60-x*.7)%900+900)%900;box(tx,G+28+(i%3)*14,22,4,'#3d5667')}
for(const b of blocks){let bx=b.x-x+px;if(bx>W+80||bx< -90)continue;ctx.fillStyle=b.style==='tall'?'#ff8c9b':'#ffcc76';if(b.style==='double'){for(let j=0;j<2;j++){ctx.beginPath();ctx.moveTo(bx+j*28,G);ctx.lineTo(bx+j*28+14,G-b.h);ctx.lineTo(bx+j*28+28,G);ctx.fill()}}else if(b.style==='spike'){ctx.beginPath();ctx.moveTo(bx,G);ctx.lineTo(bx+b.w/2,G-b.h);ctx.lineTo(bx+b.w,G);ctx.fill()}else{box(bx,G-b.h,b.w,b.h,'#ff8c9b');box(bx+5,G-b.h+8,b.w-10,7,'#ffe2b4')}}
let fx=finish-x+px;if(fx<W+30){box(fx,G-130,7,130,'#f4e09d');box(fx+7,G-130,64,36,'#f4e09d');ctx.fillStyle='#24334c';ctx.font='bold 18px monospace';ctx.fillText('GO!',fx+16,G-106)}
if(state!=='dead'){box(px,py,PW,PH,'#f6df8e');box(px+5,py+6,6,6,'#293450');box(px+19,py+6,6,6,'#293450');box(px+8,py+22,14,5,'#e78f80');box(px+3,py+PH-2,10,5,'#f0a976');box(px+19,py+PH-2,10,5,'#f0a976')}for(const p of particles)box(p.x,p.y,5,5,p.life%2?'#ffe3a0':'#e99495');if(flash>0&&flash%3<2)box(0,0,W,H,'#d9585b55');ctx.restore()}
let last=0,acc=0;function loop(now){let delta=Math.min(40,now-last||16.67);last=now;acc+=delta;let n=0;while(acc>=16.667&&n++<3){update();acc-=16.667}draw();requestAnimationFrame(loop)}
$('surface').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();if(state==='dead'){reset();return}jump()});window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW','Enter'].includes(e.code)){e.preventDefault();if(e.repeat)return;if(state==='dead')reset();else jump()}});$('sound').onclick=()=>{musicOn=!musicOn;$('sound').textContent=musicOn?'♫ ON':'♫ OFF'};show('ALMOST!','ONE BUTTON. ONE JUMP.<br>How hard can it be?','LET’S GO',reset);state='intro';build();setHud();requestAnimationFrame(loop);
})();
</script><script src="../share.js?v=20261018-1" defer></script></body></html>
