<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Int. Brus Li og Bers on the Run</title><style>*{box-sizing:border-box}body{margin:0;background:#10172c;color:#f5e6a5;font:15px system-ui}header,main{max-width:750px;margin:auto;padding:8px}header{display:flex;justify-content:space-between;align-items:center}a{color:#9de4db}h1{font-size:17px;text-align:center}canvas{width:100%;aspect-ratio:16/10;image-rendering:pixelated;border:3px solid #7f9bc0;background:#11182d;touch-action:none}.hud{display:flex;justify-content:space-between;margin:8px 0}.controls{display:flex;justify-content:space-between;margin-top:12px}.pad{display:grid;grid-template-columns:repeat(3,55px);gap:5px}.actions{display:flex;gap:8px;align-items:center}button{background:#34486e;color:#fff1bc;border:1px solid #98accd;border-radius:10px;padding:10px 13px;font:inherit;touch-action:none}.pad button,.actions button{font-size:20px;font-weight:bold;min-height:55px}.overlay{position:fixed;inset:0;background:#0b1229f0;display:grid;place-items:center;padding:20px;z-index:4}.overlay.hidden{display:none}.panel{width:min(360px,95vw);background:#263b5a;border:3px solid #eacb75;border-radius:16px;text-align:center;padding:24px}.panel input{padding:12px;width:100%;font-size:23px;text-align:center;border-radius:8px;margin:8px 0}.panel button{background:#f2d484;color:#14213b;font-weight:bold}.note{text-align:center;font-size:12px;color:#b4c4d8}</style></head><body><header><a href="../">← Lompack</a><h1>INT. BRUS LI OG BERS ON THE RUN</h1><button id="music">♫ ON</button></header><main><div class="hud"><b id="stage">STAGE 1</b><b id="lives">♥ ♥ ♥</b><b id="score">00000</b></div><canvas id="game" width="640" height="400"></canvas><div class="note" id="hint">Collect all glowing objects and reach the exit!</div><div class="controls"><div class="pad"><span></span><button data-key="up">▲</button><span></span><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div class="actions"><button data-key="jump">JUMP</button><button data-key="hit">HIT</button></div></div><div class="note">Arrows/WASD • Space = jump • X = hit · Original SID-inspired music</div></main><div class="overlay" id="lock"><div class="panel"><h2>🔒 SECRET ARCADE</h2><p>Enter the password</p><input type="password" inputmode="numeric" id="password" placeholder="•••"><button id="unlock">UNLOCK</button><p id="error"></p></div></div><div class="overlay hidden" id="modal"><div class="panel"><h2 id="title"></h2><p id="desc"></p><button id="continue">CONTINUE</button></div></div><script>
(()=>{const $=id=>document.getElementById(id),cv=$('game'),g=cv.getContext('2d'),K={left:0,right:0,up:0,down:0,jump:0,hit:0};let stage=1,lives=3,score=0,mode='locked',p,platforms=[],ladders=[],items=[],enemies=[],spikes=[],exit,frame=0,hitTimer=0,inv=0,attackReady=true,duelHits=0,enemyHits=0,ac=null,musicOn=true,beat=0,timer=null;
function beep(f,d=.12,v=.035,type='square'){if(!musicOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(v,ac.currentTime);a.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(a);a.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const roots=[110,110,146.8,164.8,110,130.8,146.8,164.8,98,130.8,146.8,123.5,110,146.8,164.8,110],scale=[1,1.125,1.25,1.333,1.5,1.667,1.875,2],mel=[0,2,4,7,5,4,2,0,4,5,7,5,4,2,0,2,0,4,7,5,4,2,4,5,7,5,4,2,0,2,4,0];
function music(){if(mode==='play'){let i=beat%128,r=roots[Math.floor(i/8)],j=i%8;if(j%4===0)beep(r/2,.23,.025,'triangle');if(j!==3)beep(r*scale[mel[(i+Math.floor(i/32)*5)%32]],.16,.012);if(j%2===0)beep(600,.025,.006)}beat++;timer=setTimeout(music,beat%2?195:115)}
function reset(){let type=(stage-1)%4;p={x:36,y:320,w:20,h:29,vx:0,vy:0,ground:false,face:1};platforms=[{x:0,y:370,w:640,h:30}];ladders=[];items=[];enemies=[];spikes=[];duelHits=0;enemyHits=0;inv=65;hitTimer=0;if(type===0){platforms.push({x:70,y:292,w:180,h:13},{x:325,y:220,w:230,h:13},{x:50,y:135,w:210,h:13});ladders=[{x:125,y:292,h:78},{x:415,y:220,h:72},{x:105,y:135,h:85}];items=[{x:100,y:269},{x:200,y:269},{x:360,y:196},{x:510,y:196},{x:180,y:110}];enemies=[{x:290,y:340,min:275,max:590,v:1.1},{x:345,y:190,min:340,max:540,v:-.9}];$('hint').textContent='BRUS LI · Collect lanterns, climb ladders, dodge enemies'}
if(type===1){platforms.push({x:65,y:302,w:120,h:12},{x:230,y:252,w:110,h:12},{x:370,y:200,w:100,h:12},{x:490,y:145,w:130,h:12});items=[{x:130,y:275},{x:290,y:225},{x:425,y:175},{x:540,y:120}];spikes=[{x:188,y:357,w:35,h:13},{x:345,y:357,w:40,h:13}];enemies=[{x:280,y:340,min:270,max:440,v:1.2}];$('hint').textContent='BERS ON THE RUN · Jump spikes and collect keys'}
if(type===2){p.x=90;platforms=[{x:0,y:355,w:640,h:45}];enemies=[{x:490,y:326,min:50,max:590,v:0,boss:true}];$('hint').textContent='INTERNATIONAL KARATE · Land three hits'}
if(type===3){platforms.push({x:60,y:295,w:160,h:13},{x:280,y:240,w:150,h:13},{x:470,y:175,w:140,h:13});ladders=[{x:125,y:295,h:75},{x:340,y:240,h:55}];items=[{x:130,y:270},{x:345,y:215},{x:530,y:150}];spikes=[{x:235,y:357,w:40,h:13}];enemies=[{x:485,y:340,min:475,max:595,v:-1.2,boss:true,hp:3},{x:290,y:210,min:285,max:420,v:1}];$('hint').textContent='THE MASHUP · Collect, climb, fight and escape'}
exit={x:590,y:type===1?103:329,w:28,h:40};$('stage').textContent=['BRUS LI','BERS ON THE RUN','INT. KARATE','THE MASHUP'][type]+' · '+(Math.floor((stage-1)/4)+1);hud()}
function hud(){$('lives').textContent='♥ '.repeat(Math.max(0,lives));$('score').textContent=String(score).padStart(5,'0')}
function modal(title,desc,action){mode='pause';$('title').textContent=title;$('desc').textContent=desc;$('modal').classList.remove('hidden');$('continue').onclick=()=>{$('modal').classList.add('hidden');action();mode='play'}}
function next(){score+=200;stage++;reset();modal('STAGE CLEAR! ✦','Next challenge awaits',()=>{});beep(880,.28)}
function damage(){if(inv>0)return;lives--;inv=90;beep(160,.3);p.x=36;p.y=320;p.vy=0;hud();if(lives<=0)modal('GAME OVER','Score: '+score,()=>{stage=1;lives=3;score=0;reset()})}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(){frame++;if(inv>0)inv--;if(hitTimer>0)hitTimer--;let type=(stage-1)%4,dx=(K.right?1:0)-(K.left?1:0);p.vx=dx*(type===1?3.5:2.9);if(dx)p.face=dx;
if(K.hit&&attackReady){attackReady=false;hitTimer=12;beep(360,.08);if(type===2){let e=enemies[0];if(Math.abs(e.x-p.x)<70&&Math.sign(e.x-p.x)===p.face){duelHits++;e.x+=p.face*50;score+=100;if(duelHits>=3){next();return}}}}if(!K.hit)attackReady=true;
let climbing=false;for(const l of ladders)if((K.up||K.down)&&p.x+p.w>l.x-8&&p.x<l.x+28&&p.y+p.h>l.y-10&&p.y<l.y+l.h+10){climbing=true;p.y+=(K.up?-3:3);p.vy=0;break}
if(!climbing){if(K.jump&&p.ground){p.vy=-10.5;p.ground=false;beep(280,.07)}p.vy=Math.min(10,p.vy+.5);let ny=p.y+p.vy;p.ground=false;for(const f of platforms)if(p.vy>=0&&p.y+p.h<=f.y+7&&ny+p.h>=f.y&&p.x+p.w>f.x&&p.x<f.x+f.w){ny=f.y-p.h;p.vy=0;p.ground=true}p.y=ny}
p.x=Math.max(5,Math.min(615,p.x+p.vx));if(p.y>410){damage();return}
for(const e of enemies){if(e.hp===0)continue;if(type===2){e.x+=Math.sign(p.x-e.x)*1.15;if(Math.abs(p.x-e.x)<28&&frame%80===0)damage()}else{e.x+=e.v;if(e.x<e.min||e.x>e.max)e.v*=-1;if(overlap(p,{x:e.x,y:e.y,w:22,h:30})){if(hitTimer>0&&p.face===Math.sign(e.x-p.x)){if(e.boss){e.hp--;score+=60}else e.x=e.min;hitTimer=0;beep(560,.08)}else damage()}}}
for(const s of spikes)if(overlap(p,s))damage();for(const i of items)if(!i.got&&Math.abs(p.x+10-i.x)<20&&Math.abs(p.y+14-i.y)<23){i.got=true;score+=50;beep(680,.1)}if(type!==2&&items.every(i=>i.got)&&enemies.every(e=>!e.boss||e.hp===0)&&overlap(p,exit))next();hud()}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(){rect(0,0,640,400,'#121b35');for(let y=0;y<400;y+=32)for(let x=0;x<640;x+=32)if((x+y)/32%2===0)rect(x,y,32,32,'#1b2849');for(const f of platforms){rect(f.x,f.y,f.w,f.h,'#5c729b');rect(f.x,f.y,f.w,5,'#a4dfcf')}for(const l of ladders){rect(l.x,l.y,4,l.h,'#e7c475');rect(l.x+20,l.y,4,l.h,'#e7c475');for(let y=l.y;y<l.y+l.h;y+=14)rect(l.x,y,24,3,'#e7c475')}for(const s of spikes){g.fillStyle='#ff8497';for(let x=s.x;x<s.x+s.w;x+=12){g.beginPath();g.moveTo(x,s.y+13);g.lineTo(x+6,s.y);g.lineTo(x+12,s.y+13);g.fill()}}for(const i of items)if(!i.got){rect(i.x-6,i.y-8,12,16,'#f6d87c');rect(i.x-2,i.y-12,4,5,'#fff8cf')}
const open=items.every(i=>i.got)&&enemies.every(e=>!e.boss||e.hp===0);if((stage-1)%4!==2){rect(exit.x,exit.y,exit.w,exit.h,open?'#7bdfbf':'#4c5772');rect(exit.x+5,exit.y+6,18,27,'#1a2d45')}
for(const e of enemies){if(e.hp===0)continue;rect(e.x,e.y+10,22,20,e.boss?'#f7bc78':'#ef809a');rect(e.x+2,e.y,18,14,'#f2caa4');rect(e.x+5,e.y+5,3,3,'#1b2438')}
if(inv<=0||Math.floor(inv/6)%2===0){rect(p.x+3,p.y,14,12,'#f2c6a1');rect(p.x+2,p.y+12,16,13,'#f1d477');rect(p.x+3,p.y+25,5,5,'#8ed9dc');rect(p.x+12,p.y+25,5,5,'#8ed9dc');if(hitTimer>0)rect(p.face>0?p.x+18:p.x-16,p.y+15,16,5,'#fff3b6')}g.fillStyle='#fff0ad';g.font='bold 16px monospace';g.fillText((stage-1)%4===2?'HITS '+duelHits+'/3':'ITEMS '+items.filter(i=>i.got).length+'/'+items.length,20,25)}
function loop(){if(mode==='play')update();draw();requestAnimationFrame(loop)}
const mapping={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',Space:'jump',KeyX:'hit'};window.addEventListener('keydown',e=>{let k=mapping[e.code];if(k){e.preventDefault();K[k]=1}});window.addEventListener('keyup',e=>{let k=mapping[e.code];if(k){e.preventDefault();K[k]=0}});window.addEventListener('blur',()=>Object.keys(K).forEach(k=>K[k]=0));for(const b of document.querySelectorAll('[data-key]')){let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);K[k]=1});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>K[k]=0)}
$('unlock').onclick=()=>{if($('password').value!=='123'){$('error').textContent='Wrong password';return}$('lock').classList.add('hidden');mode='play';reset();if(!timer)music()};$('password').onkeydown=e=>{if(e.key==='Enter')$('unlock').click()};$('music').onclick=()=>{musicOn=!musicOn;$('music').textContent=musicOn?'♫ ON':'♫ OFF'};reset();requestAnimationFrame(loop)})();
</script><script src="../share.js?v=20261018-1" defer></script></body></html>
