<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132e31"><title>Lompack · Rock Paper Scissors</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#315d61,#102c31 75%);color:#fff;font:16px system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b252b}a{color:#e2f6e9;text-decoration:none}h1{font-size:17px;margin:0}main{max-width:510px;margin:auto;padding:14px;text-align:center}.panel{background:#ffffff0d;border:1px solid #ffffff27;border-radius:19px;padding:15px;margin-bottom:12px}.eyebrow{color:#bdd7cf;font-size:12px;text-transform:uppercase;letter-spacing:.1em}.tally{display:flex;align-items:center;justify-content:space-around;gap:12px}.tally strong{font-size:30px}.score{display:flex;align-items:center;justify-content:center;gap:25px;margin-top:9px}.score strong{font-size:40px}.vs{color:#c7d5ce}.arena{display:flex;justify-content:space-around;align-items:center;min-height:125px}.hand{font-size:clamp(65px,17vw,96px);line-height:1.2;filter:drop-shadow(0 5px 8px #0006)}.hand.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.6) rotate(-20deg)}60%{transform:scale(1.2)}100%{transform:scale(1)}}.status{min-height:58px;display:grid;place-items:center;font-size:18px;font-weight:700}.choices{display:flex;gap:10px;justify-content:center}.choice{background:#ffffff16;border:2px solid #ffffff40;color:white;border-radius:16px;flex:1;min-height:90px;font-size:46px;touch-action:manipulation}.choice:disabled{opacity:.25}.choice:active:not(:disabled){transform:scale(.95)}button{cursor:pointer}button:focus-visible{outline:3px solid #ffdb88}.primary{border:0;border-radius:12px;background:#ffda87;color:#203133;font:700 16px system-ui;padding:13px 20px;width:100%}.small{font-size:13px;color:#bed4cc}.dots{display:flex;gap:7px;justify-content:center;margin-top:9px}.dot{width:12px;height:12px;border-radius:50%;background:#ffffff30}.dot.on{background:#ffda87}.hidden{display:none}@media(max-height:700px){main{padding:8px}.panel{padding:10px;margin-bottom:7px}.arena{min-height:92px}.hand{font-size:66px}.choice{min-height:69px;font-size:36px}.status{min-height:42px}.score strong{font-size:30px}}
.hand.shake{animation:count-bounce 700ms ease-in-out 3;transform-origin:50% 85%}.hand.shake:nth-child(1){animation-delay:0ms}@keyframes count-bounce{0%{transform:translateY(-11px) rotate(-11deg) scale(1)}18%{transform:translateY(-4px) rotate(-6deg) scale(1.03)}42%{transform:translateY(12px) rotate(8deg) scale(.96)}52%{transform:translateY(15px) rotate(12deg) scale(.95)}70%{transform:translateY(4px) rotate(3deg) scale(1.02)}100%{transform:translateY(-11px) rotate(-11deg) scale(1)}}.status.countdown{font-size:29px;color:#ffda87}.choice:disabled{cursor:default} </style></head><body data-game="rps"><header><a href="../">← Lompack</a><h1>✊ Rock Paper Scissors ✌️</h1></header><main>
<div class="panel"><div class="eyebrow">Total matches won</div><div class="tally"><div>You<br><strong id="totalYou">0</strong></div><div>🤝</div><div>Computer<br><strong id="totalCpu">0</strong></div></div></div>
<div class="panel"><div class="eyebrow">Best of 3 · First to 2 wins</div><div class="score"><strong id="youScore">0</strong><span class="vs">VS</span><strong id="cpuScore">0</strong></div><div class="dots"><span class="dot" id="dotY1"></span><span class="dot" id="dotY2"></span><span style="width:15px"></span><span class="dot" id="dotC1"></span><span class="dot" id="dotC2"></span></div></div>
<div class="panel"><div class="arena"><div><div class="eyebrow">You</div><div class="hand" id="youHand">❔</div></div><div><div class="eyebrow">Computer</div><div class="hand" id="cpuHand">❔</div></div></div><div class="status" id="status" aria-live="polite">Opening: Scissors only! ✌️</div><div class="choices"><button class="choice" id="rock" aria-label="Rock">✊</button><button class="choice" id="paper" aria-label="Paper">✋</button><button class="choice" id="scissors" aria-label="Scissors">✌️</button></div><p class="small" id="hint">Your opening move is always scissors.</p></div>
<button class="primary hidden" id="again">Play Again ↻</button><p class="small">Keep playing as many matches as you like.</p>
</main><script>
const $=id=>document.getElementById(id),symbols={rock:'✊',paper:'✋',scissors:'✌️'},moves=Object.keys(symbols);
let ys=0,cs=0,yt=0,ct=0,turn=0,over=false,phase='opening',timers=[],roundToken=0;
function later(fn,ms){const token=roundToken;timers.push(setTimeout(()=>{if(token===roundToken)fn()},ms))}
function clearTimers(){roundToken++;timers.forEach(clearTimeout);timers=[]}
function display(){
 $('youScore').textContent=ys;$('cpuScore').textContent=cs;$('totalYou').textContent=yt;$('totalCpu').textContent=ct;
 for(let i=1;i<=2;i++){$('dotY'+i).classList.toggle('on',ys>=i);$('dotC'+i).classList.toggle('on',cs>=i)}
 for(const m of moves)$(m).disabled=over||(phase!=='choose'&&!(phase==='opening'&&m==='scissors'));
 $('again').classList.toggle('hidden',!over);
 $('hint').textContent=over?'Ready for another match?':phase==='opening'?'Tap scissors to begin.':phase==='choose'?'Choose NOW! You have 1.5 seconds.':'Watch the countdown…';
}
function showHands(a,b){$('youHand').textContent=a;$('cpuHand').textContent=b;for(const id of ['youHand','cpuHand']){$(id).classList.remove('pop');void $(id).offsetWidth;$(id).classList.add('pop')}}
function finishRound(m,fail=false){
 if(over||phase==='result')return;clearTimers();phase='result';
 $('youHand').classList.remove('shake');$('cpuHand').classList.remove('shake');$('status').classList.remove('countdown');
 const cpu=moves[Math.floor(Math.random()*3)];
 showHands(fail?'❌':symbols[m],symbols[cpu]);
 if(fail){window.LomAudio?.fx('hurt');cs++;$('status').textContent='FAIL! Too slow — Computer +1'}
 else if(m===cpu){window.LomAudio?.fx('move');$('status').textContent='Tie! No points.'}
 else if((m==='rock'&&cpu==='scissors')||(m==='paper'&&cpu==='rock')||(m==='scissors'&&cpu==='paper')){ys++;window.LomAudio?.fx('win');$('status').textContent='You win this round! +1 🎉'}
 else{cs++;window.LomAudio?.fx('lose');$('status').textContent='Computer wins this round! +1'}
 turn++;
 if(ys>=2||cs>=2){over=true;phase='over';if(ys>=2){yt++;$('status').textContent='🏆 You won the match!'}else{ct++;$('status').textContent='Computer won the match!'}display();return}
 display();later(startCountdown,1650);
}
function startCountdown(){
 if(over)return;clearTimers();phase='countdown';
 $('youHand').textContent='✊';$('cpuHand').textContent='✊';
 $('youHand').classList.add('shake');$('cpuHand').classList.add('shake');
 $('status').classList.add('countdown');$('status').textContent='Ready…';display();
 // Count on the bottom of each hand stroke (at 0.35s, 1.05s, 1.75s).
 later(()=>{$('status').textContent='ONE';window.LomAudio?.fx('beat')},350);
 later(()=>{$('status').textContent='TWO';window.LomAudio?.fx('beat')},1050);
 later(()=>{$('status').textContent='THREE!';phase='choose';window.LomAudio?.fx('beat');display()},1750);
 later(()=>{if(phase==='choose')finishRound(null,true)},3250);
}
function play(m){
 if(over)return;
 if(phase==='opening'){if(m!=='scissors')return;phase='result';showHands('✌️','✌️');$('status').textContent='Both open with scissors! Get ready…';display();later(startCountdown,900);return}
 if(phase!=='choose')return;
 finishRound(m);
}
function newMatch(){clearTimers();ys=0;cs=0;turn=0;over=false;phase='opening';$('youHand').classList.remove('shake');$('cpuHand').classList.remove('shake');$('status').classList.remove('countdown');$('youHand').textContent='❔';$('cpuHand').textContent='❔';$('status').textContent='Opening: Scissors only! ✌️';display()}
for(const m of moves)$(m).onclick=()=>play(m);$('again').onclick=newMatch;display();
</script><script src="../audio.js"></script></body></html>
