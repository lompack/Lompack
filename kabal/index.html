<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12513c"><title>Lompack Kabal</title><style>*{box-sizing:border-box}body{margin:0;background:#12513c;color:white;font:14px system-ui}header{padding:10px;background:#0c3528;display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,button{padding:8px;border:0;border-radius:7px;font-size:14px}main{overflow-x:auto;padding:12px;min-height:85vh}.top,.cols{display:flex;gap:7px;margin-bottom:25px;width:max-content}.pile{width:48px;height:70px;border:1px dashed #a7c9b6;border-radius:6px;position:relative;display:grid;place-items:center}.card{position:absolute;left:0;top:0;width:48px;height:70px;border-radius:6px;background:#fff;color:#111;border:1px solid #aaa;padding:4px;font-weight:bold;font-size:15px;box-shadow:0 1px 2px #0005;touch-action:manipulation}.red{color:#c32735}.back{background:repeating-linear-gradient(45deg,#234eac,#234eac 5px,#426ed1 5px,#426ed1 10px);border:3px solid white}.selected{outline:3px solid #ffdf66;z-index:100!important}.col{width:48px;min-height:70vh;position:relative;border-top:1px dashed #b4d0bd}a{color:white}</style></head><body><header><a href="../">← Lompack</a><label>Stokker <select id="decks"><option>1</option><option>2</option></select></label><label>Kolonner <select id="columns"></select></label><label>Trekk <select id="draw"></select></label><button id="new">Ny kabal</button><span id="status"></span></header><main><div class="top"><div class="pile" id="stock"></div><div class="pile" id="waste"></div><div style="width:12px"></div><div id="foundations" style="display:flex;gap:7px"></div></div><div class="cols" id="tableau"></div></main><script>
const suits=['♠','♥','♣','♦'];const red=s=>s===1||s===2;let cols=[],stock=[],waste=[],found=[],sel=null;const $=id=>document.getElementById(id);
for(let n=7;n<=12;n++)$('columns').add(new Option(n,n));for(let n=1;n<=5;n++)$('draw').add(new Option(n,n));$('draw').value='3';
function make(){let a=[];for(let d=0;d<+$('decks').value;d++)for(let s=0;s<4;s++)for(let v=1;v<=13;v++)a.push({s,v,up:false,id:d+'-'+s+'-'+v});for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){let a=make(),n=+$('columns').value;cols=Array.from({length:n},()=>[]);for(let i=0;i<n;i++)for(let j=0;j<=i;j++){let c=a.pop();c.up=j===i;cols[i].push(c)}stock=a;waste=[];found=Array.from({length:4*(+$('decks').value)},()=>[]);sel=null;render()}
function el(tag,cls,parent){let x=document.createElement(tag);x.className=cls||'';parent.appendChild(x);return x}
function card(c,parent,y,fn){let e=el('div','card'+(red(c.s)?' red':'')+(!c.up?' back':''),parent);e.style.top=y+'px';if(c.up)e.textContent=({1:'A',11:'J',12:'Q',13:'K'}[c.v]||c.v)+suits[c.s];e.onclick=ev=>{ev.stopPropagation();fn()};return e}
function pick(type,i,j){if(sel&&move(type,i)){sel=null;render();return}if(type==='col'&&cols[i][j]?.up)sel={type,i,j};else if(type==='waste'&&waste.length)sel={type};else if(type==='found'&&found[i].length)sel={type,i};else sel=null;render()}
function source(){if(!sel)return[];return sel.type==='col'?cols[sel.i].slice(sel.j):sel.type==='waste'?[waste.at(-1)]:[found[sel.i].at(-1)]}
function move(type,i){if(!sel)return false;let a=source();if(!a.length)return false;let c=a[0],dest=type==='col'?cols[i]:found[i];if(sel.type===type&&sel.i===i)return false;
if(type==='found'){if(a.length!==1||!(dest.length?dest.at(-1).s===c.s&&dest.at(-1).v+1===c.v:c.v===1))return false}
else {let last=dest.at(-1);if(last?last.v!==c.v+1||red(last.s)===red(c.s):c.v!==13)return false}
if(sel.type==='col'){cols[sel.i].splice(sel.j);let t=cols[sel.i].at(-1);if(t)t.up=true}else if(sel.type==='waste')waste.pop();else found[sel.i].pop();dest.push(...a);return true}
function render(){let fs=$('foundations'),tb=$('tableau');fs.replaceChildren();tb.replaceChildren();$('stock').replaceChildren();$('waste').replaceChildren();$('stock').onclick=draw;if(stock.length)card({up:false,s:0},$('stock'),0,draw);if(waste.length){let e=card(waste.at(-1),$('waste'),0,()=>pick('waste'));if(sel?.type==='waste')e.classList.add('selected')}
found.forEach((pile,i)=>{let p=el('div','pile',fs);p.onclick=()=>pick('found',i);if(pile.length){let e=card(pile.at(-1),p,0,()=>pick('found',i));if(sel?.type==='found'&&sel.i===i)e.classList.add('selected')}else p.textContent='A'});
cols.forEach((pile,i)=>{let p=el('div','col',tb);p.onclick=()=>pick('col',i);let y=0;pile.forEach((c,j)=>{let e=card(c,p,y,()=>pick('col',i,j));if(sel?.type==='col'&&sel.i===i&&j>=sel.j)e.classList.add('selected');y+=c.up?26:15});p.style.minHeight=Math.max(350,y+70)+'px'});
$('status').textContent=found.reduce((n,p)=>n+p.length,0)+' / '+52*(+$('decks').value);if(found.every(p=>p.length===13))$('status').textContent='🎉 Du vant!'}
function draw(){sel=null;if(stock.length){let n=+$('draw').value;while(n--&&stock.length){let c=stock.pop();c.up=true;waste.push(c)}}else if(waste.length){stock=waste.reverse();stock.forEach(c=>c.up=false);waste=[]}render()}
$('new').onclick=init;$('decks').onchange=init;$('columns').onchange=init;init();
</script></body></html>
