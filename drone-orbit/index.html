(11,10,14,.6)}.glide-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.glide-title{font-size:11px;letter-spacing:.7px;color:#e8c3a6}.glide-tools{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.mini{border:1px solid rgba(252,205,165,.24);border-radius:11px;background:#121116;color:#cbbfb7;padding:5px 7px;font-size:9px}.mini.on{color:#d9ffff;border-color:#a6e1e5}.timeline-wrap{position:relative}.axis{position:absolute;font-size:8px;letter-spacing:.5px;color:#9e8f87;z-index:2;pointer-events:none}.axis.high{top:5px;left:7px}.axis.low{bottom:6px;left:7px}.axis.time{bottom:6px;right:7px}#timeline{width:100%;height:118px;display:block;border-radius:12px;background:linear-gradient(180deg,rgba(104,46,22,.18),rgba(10,11,15,.4));touch-action:none;cursor:crosshair}#palette{width:min(100%,540px);margin:8px auto 0;min-height:50px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;opacity:1;transition:opacity .2s}#palette[hidden]{display:none}.voice-label{font-size:10px;letter-spacing:1px;color:#bdb5ad;text-transform:uppercase;margin-right:4px}.sound{border:1px solid rgba(252,205,165,.27);border-radius:17px;background:#121116;color:#f3d6bf;padding:8px 9px;font-size:10px;letter-spacing:.5px}.sound.active{border-color:#a6e1e5;color:#d9ffff;box-shadow:0 0 12px rgba(101,214,222,.32)}.sound.rest{color:#bd8d7b}.sound.remove{border-color:rgba(203,100,86,.4);color:#df9a8e}

</head><body><main><header><div class="brand">Drone <small>ORBIT</small></div><button class="menu" aria-label="Meny">☰</button></header><p class="guide" id="guide"><strong>Et tonekart.</strong> Avstand fra sentrum er pitch. Velg en planet for klang og volum.</p><section id="cosmos" aria-label="Drone i romlig tonefelt"><div class="range-mark"></div><div id="ear" class="ear sleep"><i class="outer"></i><i class="inner"></i><i class="canal"></i></div><span class="center-label">pitch · nær / fjern</span></section><div class="controls" aria-label="Dronekontroller"><button class="orb-btn" id="power" aria-label="Slå dronen på eller av">av</button><button class="orb-btn" id="root" aria-label="Endre grunntone">grunn<br>A</button><button class="orb-btn" id="range" aria-label="Endre toneomfang">en<br>oktav</button><button class="orb-btn" id="add" aria-label="Legg til ny orb">+<br>orb</button><button class="orb-btn" id="space" aria-label="Slå på eller av stor klang">stor<br>klang</button></div><section class="glide" aria-label="Grunnfrekvens over tid"><div class="glide-head"><span class="glide-title">Tegn grunntonen</span><div class="glide-tools"><button class="mini" id="hzrange">30–90 Hz</button><button class="mini on" id="loop">loop</button><button class="mini" id="duration">20 s</button><button class="mini" id="clearline">slett</button></div></div><div class="timeline-wrap"><canvas id="timeline" width="560" height="118" aria-label="Tegn en frekvenslinje med fingeren"></canvas><span class="axis high" id="highhz">90</span><span class="axis low" id="lowhz">30</span><span class="axis time">tid →</span></div></section><div id="palette" hidden aria-label="Lydpalett"><span class="voice-label">klang</span><button class="sound" data-kind="sine">sin</button><button class="sound" data-kind="square">square</button><button class="sound" data-kind="saw">saw</button><button class="sound" data-kind="voice-a">voice A</button><button class="sound" data-kind="voice-m">voice M</button><button class="sound rest" data-kind="rest">ro</button><span class="voice-label">volum</span><button class="sound" data-volume=".35">myk</button><button class="sound" data-volume=".7">nær</button><button class="sound" data-volume="1">full</button><span class="voice-label">intensitet</span><button class="sound" data-intensity=".45">lav</button><button class="sound" data-intensity=".75">midt</button><button class="sound" data-intensity="1">høy</button><span class="voice-label">fart</span><button class="sound" data-speed=".45">sakte</button><button class="sound" data-speed="1">flyt</button><button class="sound" data-speed="1.8">rask</button><span class="voice-label">vibrasjon</span><button class="sound" data-vibe="0">ren</button><button class="sound" data-vibe="1">puls</button><button class="sound" data-vibe="2">uro</button><button class="sound" id="direction">↶ retning</button><button class="sound remove" id="remove">fjern</button></div><section class="horizon"><div class="horizon-top"><span>Skumring</span><span>Vekk klangen</span><span>Daggry</span></div><div id="sweep" role="slider" aria-label="Vekk eller legg til ro alle overtoner" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="dawn"></div><div id="handle"></div></div><div class="legend">to fingre i rommet former baneplanet · bevegelsen høres fra venstre til høyre</div></section></main>
<script>

const cosmos=document.querySelector('#cosmos'),guide=document.querySelector('#guide'),power=document.querySelector('#power'),rangeButton=document.querySelector('#range'),rootButton=document.querySelector('#root'),addButton=document.querySelector('#add'),spaceButton=document.querySelector('#space'),palette=document.querySelector('#palette'),timeline=document.querySelector('#timeline'),hzrange=document.querySelector('#hzrange'),loopButton=document.querySelector('#loop'),durationButton=document.querySelector('#duration'),clearLine=document.querySelector('#clearline');let audio,master,wet,started=false,globalAwake=1,dragging=null,sweepDrag=false,ellipse=1,tilt=0,rangeOctaves=1,pointers=new Map(),gesture=null,raf,serial=0,selected=null,baseIndex=0,largeSpace=false,liveRoot=55,trajectory=[],drawingLine=false,looping=true,loopSeconds=20,rangeIndex=0,trajectoryStart=0;const bases=[['A',55],['C',65.41],['D',73.42],['E',82.41]],hzRanges=[[30,90],[50,110],[70,160]],partials=[];
function addPartial(radius=.25+Math.random()*.5,angle=Math.random()*360){let p={name:'tone '+(++serial),radius,angle,active:true,kind:'sine',volume:.7,intensity:.75,speed:1,vibe:0,direction:1,size:Math.max(18,36-radius*20),gain:.11-radius*.08};p.orbit=document.createElement('div');p.orbit.className='orbit';cosmos.append(p.orbit);p.el=document.createElement('button');p.el.className='planet';p.el.style.width=p.el.style.height=p.size+'px';p.el.setAttribute('aria-label',p.name+' overtone');p.el.addEventListener('pointerdown',e=>startDrag(e,p));cosmos.append(p.el);partials.push(p);if(audio)wire(p);return p}
function stars(){for(let i=0;i<75;i++){let s=document.createElement('i');s.className='star';s.style.left=(4+Math.random()*92)+'%';s.style.top=(4+Math.random()*92)+'%';s.style.opacity=.15+Math.random()*.65;cosmos.append(s)}}
function initAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.5;let dry=audio.createGain();wet=audio.createGain();let convolver=audio.createConvolver(),len=audio.sampleRate*3.8,imp=audio.createBuffer(2,len,audio.sampleRate);for(let ch=0;ch<2;ch++){let d=imp.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}convolver.buffer=imp;dry.gain.value=.9;wet.gain.value=0;master.connect(dry).connect(audio.destination);master.connect(convolver).connect(wet).connect(audio.destination);partials.forEach(wire)}function wire(p){p.osc=audio.createOscillator();p.gainNode=audio.createGain();p.filter=audio.createBiquadFilter();p.filter.type='lowpass';p.panner=audio.createStereoPanner();p.formants=[audio.createBiquadFilter(),audio.createBiquadFilter(),audio.createBiquadFilter()];p.formants.forEach(f=>f.type='peaking');p.gainNode.gain.value=0;p.osc.connect(p.formants[0]).connect(p.formants[1]).connect(p.formants[2]).connect(p.gainNode).connect(p.filter).connect(p.panner).connect(master);setKind(p,p.kind);p.osc.start()}function setKind(p,kind){p.kind=kind;if(!audio)return;let voice=kind==='voice-a'||kind==='voice-m';p.osc.type=voice?'sawtooth':kind==='saw'?'sawtooth':kind;let formants=kind==='voice-a'?[[800,16],[1150,12],[2900,8]]:[[350,16],[900,12],[2200,8]];p.formants.forEach((f,i)=>{f.frequency.setTargetAtTime(voice?formants[i][0]:1000,audio.currentTime,.04);f.gain.setTargetAtTime(voice?formants[i][1]:0,audio.currentTime,.04);f.Q.setTargetAtTime(voice?7:1,audio.currentTime,.04)});p.osc.detune.setTargetAtTime(kind==='voice-m'?-7:kind==='voice-a'?4:0,audio.currentTime,.04)}function rootAt(t){if(trajectory.length<2)return bases[baseIndex][1];let u=(t-trajectoryStart)/1000/loopSeconds;if(looping)u=((u%1)+1)%1;else u=Math.max(0,Math.min(1,u));let a=trajectory[0],b=trajectory[trajectory.length-1];for(let i=1;i<trajectory.length;i++)if(u<=trajectory[i].x){a=trajectory[i-1];b=trajectory[i];break}let q=(u-a.x)/(b.x-a.x||1),v=a.y+(b.y-a.y)*q,r=hzRanges[rangeIndex];return r[0]+(1-v)*(r[1]-r[0])}function freq(p){return liveRoot*Math.pow(2,Math.max(0,Math.min(1,(p.radius-.13)/.7))*rangeOctaves)}function sound(p,xyz={x:0,z:0}){if(!audio)return;let near=1-p.radius;p.osc.frequency.setTargetAtTime(freq(p),audio.currentTime,.05);p.gainNode.gain.setTargetAtTime(started&&p.active?p.gain*p.volume*(.55+near*.75)*globalAwake:0,audio.currentTime,.11);p.panner.pan.setTargetAtTime(xyz.x,audio.currentTime,.08);p.filter.frequency.setTargetAtTime(650+Math.max(0,xyz.z+1)*3900,audio.currentTime,.12)}
function draw(t=0){liveRoot=rootAt(t);let r=cosmos.getBoundingClientRect(),c=r.width/2;partials.forEach((p,i)=>{let motion=started&&p.active?Math.sin(t/(1100/(p.speed||1))+i*1.9)*2.4*p.intensity*globalAwake:0,vib=started&&p.vibe?Math.sin(t/(115-p.vibe*28)+i)*p.vibe*1.6:0,rad=c*p.radius+motion+vib,a=(p.angle+p.direction*t/1000*(2+i*.27)*p.speed)*Math.PI/180,ex=Math.cos(a)*rad,ey=Math.sin(a)*rad*ellipse,ct=Math.cos(tilt),st=Math.sin(tilt),x=(ex*ct-ey*st)/c,y=(ex*st+ey*ct)/c,z=Math.sin(a+tilt)*ellipse;p.el.style.left=c+x*c+'px';p.el.style.top=c+y*c+'px';p.el.style.opacity=.48+p.intensity*.52;p.orbit.style.left=c+'px';p.orbit.style.top=c+'px';p.orbit.style.width=p.radius*200+'%';p.orbit.style.height=p.radius*200*ellipse+'%';p.orbit.style.transform='translate(-50%,-50%) rotate('+tilt+'rad)';p.orbit.style.opacity=p.active?.18+p.intensity*.55:.13;p.orbit.classList.toggle('off',!p.active);p.el.classList.toggle('off',!p.active);if(audio&&p.vibe)p.osc.detune.setTargetAtTime(Math.sin(t/(90-p.vibe*12)+i)*p.vibe*9,audio.currentTime,.035);sound(p,{x,z})});drawTimeline(t);raf=requestAnimationFrame(draw)}
function toggle(){initAudio();started=!started;if(started){audio.resume();trajectoryStart=performance.now()}partials.forEach(p=>sound(p));power.textContent=started?'på':'av';power.classList.toggle('on',started);document.querySelector('#ear').classList.toggle('sleep',!started);guide.innerHTML=started?'<strong>Dronen er våken.</strong> Avstanden fra sentrum bestemmer pitch. Planetene vandrer gjennom stereobildet.':'<strong>Dronen hviler.</strong> Slå den på fra siden når du vil lytte.'}
function choose(p){selected=p;partials.forEach(q=>q.el.classList.toggle('selected',q===p));palette.hidden=false;document.querySelectorAll('.sound[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind===p.kind));document.querySelectorAll('.sound[data-volume]').forEach(b=>b.classList.toggle('active',Number(b.dataset.volume)===p.volume));document.querySelectorAll('.sound[data-intensity]').forEach(b=>b.classList.toggle('active',Number(b.dataset.intensity)===p.intensity));document.querySelectorAll('.sound[data-speed]').forEach(b=>b.classList.toggle('active',Number(b.dataset.speed)===p.speed));document.querySelectorAll('.sound[data-vibe]').forEach(b=>b.classList.toggle('active',Number(b.dataset.vibe)===p.vibe));document.querySelector('#direction').textContent=p.direction===1?'↶ retning':'↷ retning';guide.innerHTML='<strong>'+p.name+'</strong> er valgt. Form dens klang, kraft og bevegelse nedenfor.'}function startDrag(e,p){if(pointers.size)return;e.preventDefault();e.stopPropagation();dragging={p,moved:false};p.el.setPointerCapture?.(e.pointerId);p.el.classList.add('focus');document.addEventListener('pointermove',movePlanet);document.addEventListener('pointerup',endPlanet,{once:true})}function movePlanet(e){if(!dragging)return;let p=dragging.p,r=cosmos.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);dragging.moved=true;p.radius=Math.max(.13,Math.min(.83,Math.hypot(dx,dy)/(r.width/2)));p.angle=Math.atan2(dy,dx)*180/Math.PI-tilt*180/Math.PI;guide.innerHTML='<strong>'+p.name+'</strong> · '+(p.radius<.36?'lavt':p.radius<.61?'midt i':'lyst')+' i '+rangeText()+'.'}function endPlanet(){if(!dragging)return;let p=dragging.p;if(!dragging.moved)choose(p);p.el.classList.remove('focus');dragging=null;document.removeEventListener('pointermove',movePlanet)}function rangeText(){return rangeOctaves===1?'ett oktavrom':rangeOctaves===2?'to oktavrom':'et vidt rom'}
function twoStart(){let q=[...pointers.values()];gesture={d:Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),a:Math.atan2(q[1].y-q[0].y,q[1].x-q[0].x),ellipse,tilt};guide.innerHTML='<strong>Du former baneplanet.</strong> Klem for ellipse, vri for retning og dybde.'}function twoMove(){if(!gesture||pointers.size<2)return;let q=[...pointers.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),a=Math.atan2(q[1].y-q[0].y,q[1].x-q[0].x);ellipse=Math.max(.42,Math.min(1.55,gesture.ellipse*d/gesture.d));tilt=gesture.tilt+a-gesture.a}

<style>
.glide-title{border:0;padding:2px 0;background:transparent;color:#e8c3a6;font:inherit;font-size:11px;letter-spacing:.7px;text-align:left;cursor:pointer}.glide-title::after{content:' −';color:#a6e1e5}.glide.collapsed{padding:9px 10px}.glide.collapsed .glide-head{margin-bottom:0}.glide.collapsed .glide-tools,.glide.collapsed .timeline-wrap{display:none}.glide.collapsed .glide-title::after{content:' +'}

<script>
(() => {
  const panel=document.querySelector('.glide');
  const oldTitle=panel.querySelector('.glide-title');
  const title=document.createElement('button');
  title.type='button'; title.className='glide-title'; title.id='toggleGlide';
  title.textContent=oldTitle.textContent; title.setAttribute('aria-expanded','true');
  oldTitle.replaceWith(title);
  title.addEventListener('click',()=>{
    const closed=panel.classList.toggle('collapsed');
    title.setAttribute('aria-expanded',String(!closed));
  });

  const originalSound=sound;
  sound=function(p,xyz={x:0,z:0}){
    originalSound(p,xyz);
    if(!audio || p.kind==='sine') return;
    const near=1-p.radius;
    const level=Math.pow(10,-10/20);
    p.gainNode.gain.setTargetAtTime(started&&p.active?p.gain*p.volume*(.55+near*.75)*level*globalAwake:0,audio.currentTime,.11);
  };
})();
</script>
