<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GRAVITY</title><style>*{box-sizing:border-box}body{margin:0;background:#121b35;color:white;font:16px system-ui;overflow:hidden}canvas{width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:12px 18px;display:flex;justify-content:space-between;pointer-events:none}button{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 100px);left:50%;transform:translateX(-50%);background:#ffd36b;color:#202035;border:0;border-radius:16px;padding:16px 52px;font-size:23px;font-weight:900}#message{position:fixed;top:32%;width:100%;text-align:center;font-size:24px;font-weight:bold;text-shadow:0 2px 7px black;pointer-events:none;padding:15px}small{font-size:13px}</style><canvas id="c"></canvas><header><span><b>GRAVITY</b><br><small id="lvl">Bane 1 / 7</small></span><span id="clock">0.0 s</span></header><div id="message">Bygg til den gylne linjen!<br><small>Tre klosser kommer automatisk. Dra pendelen og trykk på banen for tre til.</small></div><button id="btn">START</button><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),btn=document.querySelector('#btn'),msg=document.querySelector('#message'),lvl=document.querySelector('#lvl'),clock=document.querySelector('#clock');let W,H,D,ground,goal,level=1,time=0,blocks=[],moving=null,gravity=0,drag=false,mode='ready',last=0,anim=0,batch=0,dropTimer=0;const themes=[['#142d32','#438365'],['#432b54','#f3a468'],['#10172d','#426ca1'],['#28415d','#b8e4f3'],['#431b24','#ee7043'],['#090e26','#5958aa'],['#2b1d48','#ac73b8']],colors=['#f2b65e','#70c6bc','#bc9bea','#ee8c99','#7ebcf1','#e8d27b'];function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);ground=H*.76;goal=H*.25}addEventListener('resize',size);size();function spawn(){let w=Math.max(33,Math.min(115,W*.27)-level*7+(Math.random()-.5)*17),h=Math.max(20,H*.032);moving={x:Math.random()<.5?-w:W+w,y:ground-(blocks.length+1)*(h+2),w,h,v:(Math.random()<.5?1:-1)*(120+level*25),color:colors[blocks.length%6]}}function beginBatch(){batch=0;dropTimer=0;mode='play';msg.textContent='';btn.style.display='none';moving=null}function stage(){blocks=[];moving=null;gravity=0;mode='ready';lvl.textContent='Bane '+level+' / 7';msg.innerHTML='Bane '+level+'<br><small>Bygg et stabilt tårn!</small>';btn.textContent='START';btn.style.display='block'}function action(){if(mode==='ready'||mode==='fallen'){blocks=[];beginBatch()}else if(mode==='pause'){beginBatch()}else if(mode==='win'){if(level===7){mode='end';let creature=['enhjørning 🦄','virus 🦠','Dracula 🧛','hund 🐕','elg 🫎','mus 🐭','dinosaur 🦖','skilpadde 🐢'][Math.floor(Math.random()*8)];msg.innerHTML='👸 🐎 🤴<br><small>🎺 Prinsen kysser prinsessen!<br>Hesten blir til '+creature+' og spiser begge to!<br>THE END — '+time.toFixed(1)+' sekunder</small>';btn.textContent='SPILL IGJEN';btn.style.display='block'}else{level++;stage()}}else if(mode==='end'){level=1;time=0;stage()}}btn.onclick=e=>{e.stopPropagation();action()};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();action()}if(e.code==='ArrowLeft')gravity=Math.max(-1,gravity-.12);if(e.code==='ArrowRight')gravity=Math.min(1,gravity+.12)});function setG(px){gravity=Math.max(-1,Math.min(1,(px-W/2)/(W*.39)))}c.onpointerdown=e=>{if(e.clientY>H*.78){e.preventDefault();drag=true;c.setPointerCapture(e.pointerId);setG(e.clientX)}else if(mode==='pause')beginBatch()};c.onpointermove=e=>{if(drag)setG(e.clientX)};c.onpointerup=()=>drag=false;function rect(cx,cy,w,h,color){x.fillStyle=color;x.fillRect(cx-w/2,cy,w,h)}function frame(t){let dt=Math.min((t-last)/1000||0,.035);last=t;if(mode==='play'||mode==='pause'){time+=dt;if(mode==='play'){dropTimer-=dt;if(!moving&&dropTimer<=0)spawn();if(moving){moving.x+=moving.v*dt;if(moving.x<-moving.w||moving.x>W+moving.w)moving.v*=-1;if(Math.abs(moving.x-W/2)<Math.max(9,moving.w*.14)||dropTimer< -1.5){blocks.push({...moving,x:moving.x+(Math.random()-.5)*moving.w*.3,a:0,spin:0});moving=null;batch++;dropTimer=0;if(blocks.at(-1).y<=goal+10){mode='win';anim=0;msg.innerHTML='🦍 TÅRNET ER BYGGET!<br><small>Gorillaen feirer!</small>';btn.textContent='NESTE';btn.style.display='block'}else if(batch>=3){mode='pause';msg.innerHTML='JUSTER BALANSEN<br><small>Trykk på banen for 3 nye klosser</small>'}}}}let tilt=0;for(let i=0;i<blocks.length;i++){let b=blocks[i],below=blocks[i-1],sx=below?below.x:W/2,sw=below?below.w:Math.max(75,W*.27),off=b.x-sx+gravity*(i+1)*3,overlap=Math.min(b.x+b.w/2,sx+sw/2)-Math.max(b.x-b.w/2,sx-sw/2);if(overlap<Math.min(10,b.w*.15)||Math.abs(off)>(sw+b.w)*.28)tilt+=Math.sign(off||1)*dt*(.7+Math.abs(off)/sw)*(i+1)*.45;b.spin+=tilt*dt*3;b.a+=b.spin*dt;b.x+=gravity*dt*(i+1)*2+tilt*dt*9}if(blocks.some(b=>Math.abs(b.a)>.65||b.x<0||b.x>W)){mode='fallen';moving=null;msg.innerHTML='💥 TÅRNET VELTET!<br><small>Prøv samme bane igjen. Tiden fortsetter.</small>';btn.textContent='PRØV IGJEN';btn.style.display='block'}}if(mode==='win')anim+=dt;clock.textContent=time.toFixed(1)+' s';let p=themes[level-1],g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,p[0]);g.addColorStop(1,p[1]);x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle='#f5d77c';x.setLineDash([7,6]);x.beginPath();x.moveTo(12,goal);x.lineTo(W-12,goal);x.stroke();x.setLineDash([]);x.fillStyle='#f5d77c';x.font='12px system-ui';x.fillText('MÅL 75%',16,goal-10);x.strokeStyle='#ffffff44';x.setLineDash([4,5]);x.beginPath();x.moveTo(W/2,goal);x.lineTo(W/2,ground);x.stroke();x.setLineDash([]);x.fillStyle='#d5dfed';x.fillRect(12,ground,W-24,9);for(let b of blocks){x.save();x.translate(b.x,b.y+b.h/2);x.rotate(b.a);rect(0,-b.h/2,b.w,b.h,b.color);x.restore()}if(moving)rect(moving.x,moving.y,moving.w,moving.h,moving.color);if(mode==='win'){x.textAlign='center';x.font='44px serif';x.fillText('🦍',W/2+Math.sin(anim*8)*5,goal-15);x.textAlign='left'}x.strokeStyle='#eef3ff';x.lineWidth=2;x.beginPath();x.moveTo(W/2,ground+9);x.lineTo(W/2+gravity*W*.39,H*.87);x.stroke();x.fillStyle='#ffd36b';x.beginPath();x.arc(W/2+gravity*W*.39,H*.87,13,0,7);x.fill();x.textAlign='center';x.fillStyle='white';x.font='12px system-ui';x.fillText('← DRA GRAVITY →',W/2,H*.93);x.textAlign='left';requestAnimationFrame(frame)}stage();requestAnimationFrame(frame);
</script></html>
