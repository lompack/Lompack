<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132e31"><title>Lompack • Dragon Wheel</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#27585a,#112c32 70%);color:#fff;font:16px system-ui,-apple-system,sans-serif}header{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#10272c}a{color:#cbe9d7;text-decoration:none}h1{font-size:23px;margin:0}main{max-width:900px;margin:auto;padding:16px}button,select,input{font:inherit;border:0;border-radius:10px;padding:10px}button{cursor:pointer;background:#f5cf78;color:#182d2e;font-weight:750}button:disabled{opacity:.4;cursor:default}select,input{background:#e8f3ec;color:#172b2b}section{background:#ffffff0c;border:1px solid #ffffff25;border-radius:16px;padding:14px;margin-bottom:14px}.settings{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.settings label{display:flex;gap:8px;align-items:center}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.player{border:2px solid #ffffff20;border-radius:14px;padding:12px;background:#081b1d6b}.player.active{border-color:#f8d279;box-shadow:0 0 0 2px #f8d27933}.player.winner{border-color:#78e0a7}.player-head{display:flex;justify-content:space-between;align-items:center;gap:4px}.player input{min-width:0;width:100%;background:transparent;color:white;font-weight:700;padding:4px}.score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}.score-buttons{display:flex;gap:6px}.score-buttons button{padding:5px 13px}.wheel-area{position:relative;max-width:490px;margin:0 auto;text-align:center}.wheel-wrap{position:relative;width:100%;aspect-ratio:1}canvas{display:block;width:100%;height:100%}.pointer{position:absolute;left:50%;top:0;transform:translate(-50%,-14%);z-index:4;filter:drop-shadow(0 3px 2px #0008);font-size:38px;color:#fff}.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#f9e0a2;border:5px solid #4d3d20;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#3d3021;font-size:24px;pointer-events:none}.choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}.choices button{background:#ffffff1b;border:1px solid #ffffff3c;color:white;min-width:43px}.choices button.chosen{background:#f7d47f;color:#1c2e2b;border-color:#f7d47f}.choices button:disabled{opacity:.45}.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.controls button{font-size:19px;padding:13px 26px}.message{text-align:center;min-height:52px;margin:12px 0;font-weight:650}.muted{color:#b6d0c8;font-size:13px}.dragon-scene{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;overflow:hidden;background:#120d0d65}.dragon-scene.show{display:block}.dragon{position:absolute;top:15%;left:-230px;font-size:clamp(110px,26vw,210px);filter:drop-shadow(0 10px 8px #0008);animation:dragon-arrive 2.2s ease-out forwards}.flame{position:absolute;left:47%;top:31%;font-size:clamp(100px,30vw,260px);transform-origin:left center;opacity:0;animation:flame-blast 2s 1.8s ease-in-out forwards}.gameover{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%) scale(.5);width:min(90vw,520px);background:#25120ff0;border:3px solid #ef9c43;border-radius:22px;text-align:center;padding:22px;opacity:0;animation:gameover-in .6s 3.2s forwards;pointer-events:auto}.gameover h2{font-size:clamp(32px,9vw,58px);color:#ffc56e;margin:0 0 8px}.gameover p{font-size:22px}.gameover button{margin-top:8px}@keyframes dragon-arrive{to{left:15%}}@keyframes flame-blast{0%{opacity:0;transform:scale(.15) rotate(-20deg)}25%{opacity:1}75%{opacity:1;transform:scale(1.45) rotate(5deg)}100%{opacity:0;transform:scale(1.8)}}@keyframes gameover-in{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@media(max-width:520px){header h1{font-size:19px}.score{font-size:25px}.player{padding:9px}.dragon{top:22%}.flame{top:38%}}
.thief-scene{position:fixed;right:-220px;top:34%;z-index:18;display:flex;align-items:center;gap:4px;font-size:95px;pointer-events:none;filter:drop-shadow(0 5px 10px #0009)}.thief-scene strong{font-size:32px;color:#ffcc72}.thief-scene.steal{animation:thief-in 2s ease-in-out forwards}.thief-hand{font-size:64px;animation:grab .5s ease-in-out 3 alternate}@keyframes thief-in{0%{right:-220px}25%,70%{right:4%}100%{right:-220px}}@keyframes grab{to{transform:translateX(-45px) rotate(-25deg)}} main{max-width:1000px;padding:7px}section{padding:8px;margin-bottom:7px;border-radius:12px}.settings{gap:6px}.settings label{gap:4px;font-size:12px}.settings select,.settings button{padding:5px;font-size:12px}.players{display:flex;gap:5px;overflow-x:auto}.player{flex:1;min-width:75px;padding:5px;border-radius:9px}.player input{font-size:12px;padding:2px}.player-head{gap:3px}.score{font-size:20px}.wheel-area{max-width:min(45vh,330px)}.message{min-height:24px;margin:3px 0;font-size:13px}.choices{gap:4px;margin:5px 0}.choices button{min-width:31px;padding:5px;font-size:13px}.controls button{padding:8px 12px;font-size:13px}.muted{font-size:10px;margin:5px 0}header{padding:7px 12px}header h1{font-size:17px}@media(max-width:600px){.wheel-area{max-width:min(42vh,82vw)}.players{flex-wrap:wrap}.player{flex:1 1 21%}.score{font-size:17px}.choices button{min-width:29px;padding:4px}.wheel-center{width:37px;height:37px;font-size:16px}.pointer{font-size:25px}main{padding:5px}section{padding:6px}} .smash-scene{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#160d2ae8;overflow:hidden;pointer-events:none}.smash-scene.show{display:flex}.smash-burst{position:absolute;width:140vmax;height:140vmax;background:#f8d42e;clip-path:polygon(50% 0%,56% 28%,75% 8%,70% 36%,100% 28%,77% 50%,100% 72%,69% 65%,75% 94%,54% 73%,50% 100%,43% 72%,23% 94%,30% 64%,0 73%,22% 50%,0 28%,31% 36%,25% 7%,44% 29%);animation:smashburst .65s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 22px #000)}.smash-title{position:absolute;top:22%;width:100%;text-align:center;color:#e52c40;font-size:clamp(44px,13vw,130px);font-weight:1000;letter-spacing:-.06em;font-style:italic;line-height:.9;-webkit-text-stroke:2px #171125;text-shadow:6px 8px 0 #fff,10px 13px 0 #171125;transform:rotate(-9deg);animation:smashword .6s both}.smash-hammer{position:absolute;top:38%;font-size:clamp(110px,29vw,270px);transform-origin:80% 90%;animation:hammerswing 1.5s .7s both}.smash-target{position:absolute;bottom:14%;font-size:clamp(26px,7vw,60px);font-weight:1000;color:#171125;text-align:center;max-width:95vw}.smash-hit{position:absolute;top:56%;font-size:clamp(42px,12vw,110px);font-weight:1000;color:#e52c40;-webkit-text-stroke:2px #151020;opacity:0;animation:smashhit .55s 1.6s forwards}@keyframes smashburst{from{transform:scale(.02) rotate(-45deg)}to{transform:scale(1) rotate(8deg)}}@keyframes smashword{from{transform:scale(.1) rotate(-35deg)}to{transform:scale(1) rotate(-9deg)}}@keyframes hammerswing{0%{transform:translate(60vw,-50vh) rotate(110deg)}65%{transform:translate(0,0) rotate(-40deg)}75%{transform:translate(0,0) rotate(18deg)}100%{transform:translate(0,0) rotate(0deg)}}@keyframes smashhit{to{opacity:1;transform:scale(1.15)}} .smash-scene{background:transparent}.smash-burst{width:100vmax;height:100vmax;opacity:.85}.smash-title{top:8%;z-index:2}.smash-hammer{top:auto;left:0;font-size:clamp(85px,21vw,180px);z-index:5;animation:hammer-to-target 1.7s .65s both;transform-origin:80% 85%}.smash-target{bottom:5%;left:50%;transform:translateX(-50%);z-index:6;background:#16142ad9;color:#fff;padding:9px 14px;border-radius:12px;font-size:clamp(15px,3vw,25px)}.smash-hit{top:auto;left:0;z-index:7;animation:impact-label .9s 1.65s both}.smoke-puff{position:fixed;width:var(--size);height:var(--size);border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#c6c5cb 40%,#686974 80%,transparent);box-shadow:0 0 14px #fff9;z-index:6;opacity:0;animation:smoke-fly 1.6s ease-out var(--delay) forwards;pointer-events:none}@keyframes hammer-to-target{0%{transform:translate(40vw,-45vh) rotate(-85deg) scale(1.2)}63%{transform:translate(0,-85px) rotate(-38deg) scale(1.15)}78%{transform:translate(0,0) rotate(15deg) scale(1)}88%{transform:translate(0,-17px) rotate(-8deg)}100%{transform:translate(0,0) rotate(0deg)}}@keyframes smoke-fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}15%{opacity:.95}75%{opacity:.8}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(2.1)}}@keyframes impact-label{0%,10%{opacity:0;transform:translate(-50%,-50%) scale(.2)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}100%{opacity:0;transform:translate(-50%,-95%) scale(1)}} </style></head><body data-game="wheel">
<header><a href="../">← Lompack</a><h1>🎡 Dragon Wheel</h1></header>
<main>
<section class="settings"><label>Mode <select id="mode"><option value="classic">Classic</option><option value="betting">Betting</option></select></label><label>Players <select id="playerCount"></select></label><label>Numbers <select id="numberCount"></select></label><button id="restart">New Game</button><button id="soundToggle" aria-pressed="true">🔊 Sound On</button></section>
<section><div class="players" id="players"></div></section>
<section><div class="wheel-area"><div class="wheel-wrap"><div class="pointer">▼</div><canvas id="wheel" width="900" height="900" aria-label="Spinning number wheel"></canvas><div class="wheel-center">★</div></div></div><div class="message" id="message" aria-live="polite"></div><div class="choices" id="choices"></div><div class="controls"><button id="changeNumbers">Change Numbers</button><label id="betControl" style="display:none">Bet <input id="bet" type="number" min="1" step="1" value="10" style="width:95px"></label><button id="spin">SPIN THE WHEEL</button></div><p class="muted" style="text-align:center"><span id="rules"></span></p></section>
</main>
<div class="smash-scene" id="smashScene" aria-live="assertive"><div class="smash-burst"></div><div class="smash-title">MONSTER<br>SMASH!</div><div class="smash-hammer">🔨</div><div class="smash-hit">−5!</div><div class="smash-target" id="smashTarget"></div></div><div id="thiefScene" class="thief-scene" aria-live="polite"><span>🥷</span><span class="thief-hand">🫳</span><strong id="thiefText">−1</strong></div><div class="dragon-scene" id="dragonScene"><div class="dragon">🐉</div><div class="flame">🔥🔥🔥</div><div class="gameover"><h2>GAME OVER!</h2><p id="winner"></p><button id="again">Play Again</button></div></div>
<script>
const $=id=>document.getElementById(id),canvas=$('wheel'),ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
let soundOn=true,audio=null,master=null,lastTickSector=null;
function audioReady(){if(!soundOn)return false;try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.23;master.connect(audio.destination)}if(audio.state==='suspended')audio.resume();return true}catch(e){return false}}
function tone(freq,duration=.13,type='sine',gain=.2,delay=0,endFreq=null){if(!audioReady())return;const t=audio.currentTime+delay,osc=audio.createOscillator(),amp=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(Math.max(25,freq),t);if(endFreq)osc.frequency.exponentialRampToValueAtTime(Math.max(25,endFreq),t+duration);amp.gain.setValueAtTime(.0001,t);amp.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),t+.012);amp.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(amp);amp.connect(master);osc.start(t);osc.stop(t+duration+.02)}
function effect(name){if(!audioReady())return;
 if(name==='tick'){tone(1250,.045,'triangle',.065);tone(370,.028,'sine',.05)}
 if(name==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.38,'sine',.22,i*.095))}
 if(name==='neighbor'){tone(587,.17,'sine',.15);tone(784,.27,'sine',.13,.11)}
 if(name==='thief'){tone(370,.28,'sawtooth',.09,0,165);tone(185,.33,'triangle',.11,.17,92)}
 if(name==='smash'){tone(95,.75,'sawtooth',.32,0,38);tone(55,.85,'triangle',.35,.05,30);tone(720,.12,'square',.08)}
 if(name==='dragon'){tone(150,1.6,'sawtooth',.25,0,40);tone(70,1.9,'triangle',.3,.1,27);[220,165,110].forEach((f,i)=>tone(f,.7,'sine',.16,i*.23,f*.6))}
}
let players=[],active=0,selected=null,numberCount=12,rotation=0,spinning=false,ended=false,animation=0,thiefTimer=0,picking=true,spinCount=0,nextSmash=9+Math.floor(Math.random()*9),smashing=false,smashTimer=0;
for(let i=1;i<=8;i++)$('playerCount').add(new Option(i,i));
for(let i=3;i<=24;i++)$('numberCount').add(new Option(i,i));
$('playerCount').value='3';$('numberCount').value='12';
function reset(){clearTimeout(smashTimer);smashing=false;spinCount=0;nextSmash=9+Math.floor(Math.random()*9);$('smashScene').classList.remove('show');cancelAnimationFrame(animation);clearTimeout(thiefTimer);$('thiefScene').classList.remove('steal');spinning=false;ended=false;rotation=0;active=0;picking=true;numberCount=+$('numberCount').value;players=Array.from({length:+$('playerCount').value},(_,i)=>({name:'Player '+(i+1),score:$('mode').value==='betting'?100:0,choice:null,bet:10}));$('dragonScene').classList.remove('show');renderAll();updateMode();renderMessage()}
function renderPlayers(){const root=$('players');root.replaceChildren();players.forEach((p,i)=>{const el=document.createElement('div');el.className='player'+(picking&&i===active&&!ended?' active':'');const name=document.createElement('input');name.value=p.name;name.setAttribute('aria-label','Player '+(i+1)+' name');name.onchange=()=>{p.name=name.value.trim()||'Player '+(i+1);renderMessage()};const info=document.createElement('div');info.className='player-head';const score=document.createElement('strong');score.className='score';score.textContent=p.score;const choice=document.createElement('span');choice.textContent=p.choice===null?'?':'#'+p.choice;choice.style.color='#f8d279';info.append(score,choice);el.append(name,info);root.appendChild(el)})}
function renderChoices(){const root=$('choices');root.replaceChildren();const chosen=players[active]?.choice;for(let n=1;n<=numberCount;n++){const b=document.createElement('button');b.textContent=n;b.className=n===chosen&&picking?'chosen':'';b.disabled=spinning||ended||!picking;b.onclick=()=>{const p=players[active];p.choice=n;if(active<players.length-1){active++;}else{active=0;picking=false;}renderAll();renderMessage()};root.appendChild(b)}}
function updateSpin(){const betting=$('mode').value==='betting';const bet=Number($('bet').value);$('betControl').style.display=betting?'flex':'none';$('bet').disabled=spinning||ended||!picking;$('spin').disabled=spinning||smashing||ended||picking||players.some(p=>p.choice===null)||(betting&&players.some(p=>p.score<bet)||!Number.isInteger(bet)||bet<1);$('spin').textContent=spinning?'SPINNING…':'SPIN THE WHEEL';$('changeNumbers').disabled=spinning||ended||picking}
function renderAll(){renderPlayers();renderChoices();drawWheel();updateSpin()}
function updateMode(){const betting=$('mode').value==='betting';$('rules').textContent=betting?'Exact +3×bet · Neighbor +1×bet · Opposite thief −1×bet · Green 0: Game Over.':'Exact +3 · Neighbor +1 · Opposite thief −1 · Green 0: Game Over.';updateSpin()}
function renderMessage(){if(ended)return;if(picking){$('message').textContent=players[active].name+', pick your number!';}else{$('message').textContent='All numbers locked. Spin the wheel!'}}
function changeNumbers(){if(spinning||smashing||ended)return;picking=true;active=0;players.forEach(p=>p.choice=null);renderAll();renderMessage()}
function drawWheel(){const w=canvas.width,c=w/2,r=w*.46,total=numberCount+1,step=TAU/total;ctx.clearRect(0,0,w,w);ctx.save();ctx.translate(c,c);ctx.rotate(rotation);
 for(let n=0;n<total;n++){const start=-Math.PI/2-step/2+n*step,end=start+step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,start,end);ctx.closePath();ctx.fillStyle=n===0?'#1cbb6b':n%2?'#f6d790':'#e9a95d';ctx.fill();ctx.strokeStyle='#213b37';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.rotate(-Math.PI/2+n*step);ctx.translate(r*.74,0);ctx.rotate(Math.PI/2);ctx.fillStyle=n===0?'#fff':'#28362d';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+(total>19?31:total>13?39:50)+'px system-ui';ctx.fillText(n,0,0);ctx.restore()}
 ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.strokeStyle='#c6a25e';ctx.lineWidth=16;ctx.stroke();ctx.restore()}
function spin(){audioReady();updateSpin();if($('spin').disabled)return;const wager=$('mode').value==='betting'?Number($('bet').value):1;players.forEach(p=>p.bet=wager);spinning=true;updateSpin();renderChoices();renderPlayers();
 const target=Math.floor(Math.random()*(numberCount+1)),step=TAU/(numberCount+1),start=rotation;
 const normalized=((start%TAU)+TAU)%TAU,desired=((TAU-target*step)%TAU+TAU)%TAU;
 const offset=(desired-normalized+TAU)%TAU;
 const final=start+TAU*(5+Math.floor(Math.random()*3))+offset;
 const duration=4700+Math.random()*1200,begin=performance.now();lastTickSector=null;
 function tick(now){const t=Math.min(1,(now-begin)/duration),ease=1-Math.pow(1-t,4);rotation=start+(final-start)*ease;const sector=Math.floor(rotation/step);if(sector!==lastTickSector){if(lastTickSector!==null)effect('tick');lastTickSector=sector}drawWheel();if(t<1){animation=requestAnimationFrame(tick)}else{rotation=final%TAU;drawWheel();resolve(target,wager)}}animation=requestAnimationFrame(tick)}
function isNeighbor(landed,chosen){const total=numberCount+1;return (landed-chosen+total)%total===1||(chosen-landed+total)%total===1}
function oppositeNumber(chosen){const total=numberCount+1;const opposite=(chosen+Math.floor(total/2))%total;return opposite===0?(chosen+Math.ceil(total/2))%total:opposite}
function showThief(amount){$('thiefText').textContent='−'+amount;$('thiefScene').classList.remove('steal');void $('thiefScene').offsetWidth;$('thiefScene').classList.add('steal');clearTimeout(thiefTimer);thiefTimer=setTimeout(()=>$('thiefScene').classList.remove('steal'),2100)}
function resolve(n,wager){spinning=false;if(n===0){effect('dragon');ended=true;$('message').textContent='The dragon has arrived!';renderAll();showDragon();return}
 let thieves=0;const reports=[];
 players.forEach(p=>{const stake=$('mode').value==='betting'?p.bet:1;let delta=0,reason='miss';
 if(n===p.choice){delta=3*stake;reason='exact';effect('win')}
 else if(n===oppositeNumber(p.choice)){delta=-stake;reason='thief';thieves+=stake}
 else if(isNeighbor(n,p.choice)){delta=stake;reason='neighbor';effect('neighbor')}
 p.score+=delta;reports.push(p.name+': '+(delta>0?'+':'')+delta+' ('+reason+')')});
 if(thieves){showThief(thieves);effect('thief')}
 spinCount++;if(spinCount>=nextSmash){nextSmash=spinCount+9+Math.floor(Math.random()*9);smashTimer=setTimeout(monsterSmash,850)}
 renderAll();$('message').textContent='Landed on '+n+'! '+reports.join(' · ')+' — Spin again or Change Numbers.';
}
function monsterSmash(){
 if(ended||spinning||smashing)return;
 smashing=true;clearTimeout(thiefTimer);$('thiefScene').classList.remove('steal');
 const hit=1+Math.floor(Math.random()*numberCount);
 const victims=players.filter(p=>p.choice===hit);
 victims.forEach(p=>p.score-=5);
 const scene=$('smashScene');
 scene.querySelectorAll('.smoke-puff').forEach(el=>el.remove());
 // Calculate the actual on-screen position of the chosen number, including wheel rotation.
 const rect=canvas.getBoundingClientRect(),step=TAU/(numberCount+1);
 const angle=-Math.PI/2+hit*step+rotation;
 const x=rect.left+rect.width/2+Math.cos(angle)*rect.width*.46*.74;
 const y=rect.top+rect.height/2+Math.sin(angle)*rect.height*.46*.74;
 const hammer=scene.querySelector('.smash-hammer'),impact=scene.querySelector('.smash-hit');
 hammer.style.left=(x-90)+'px';hammer.style.top=(y-125)+'px';
 impact.style.left=x+'px';impact.style.top=y+'px';
 $('smashTarget').textContent='Hammer hits '+hit+'! '+(victims.length?victims.map(p=>p.name).join(', ')+' −5 points!':'Nobody picked '+hit+' — lucky escape!');
 scene.classList.remove('show');void scene.offsetWidth;scene.classList.add('show');
 // Smoke originates precisely from the hit segment, not the middle of the screen.
 smashTimer=setTimeout(()=>{
  if(!smashing)return;
  effect('smash');
  for(let i=0;i<19;i++){
   const puff=document.createElement('div');puff.className='smoke-puff';
   const angle=Math.random()*TAU,distance=25+Math.random()*95;
   puff.style.left=x+'px';puff.style.top=y+'px';
   puff.style.setProperty('--size',(18+Math.random()*35)+'px');
   puff.style.setProperty('--dx',Math.cos(angle)*distance+'px');
   puff.style.setProperty('--dy',Math.sin(angle)*distance-25+'px');
   puff.style.setProperty('--delay',(Math.random()*.17)+'s');
   scene.appendChild(puff);
  }
 },1680);
 smashTimer=setTimeout(()=>{
  scene.classList.remove('show');scene.querySelectorAll('.smoke-puff').forEach(el=>el.remove());
  smashing=false;renderAll();
  $('message').textContent='MONSTER SMASH hit '+hit+'! '+(victims.length?victims.map(p=>p.name).join(', ')+' lost 5 points.':'Nobody lost points.');
 },4100);
}
function showDragon(){const max=Math.max(...players.map(p=>p.score)),winners=players.filter(p=>p.score===max);$('winner').textContent=winners.length===1?winners[0].name+' wins with '+max+' points!':'Tie! '+winners.map(p=>p.name).join(' & ')+' — '+max+' points each!';$('dragonScene').classList.remove('show');void $('dragonScene').offsetWidth;$('dragonScene').classList.add('show')}
$('soundToggle').onclick=()=>{soundOn=!soundOn;$('soundToggle').textContent=soundOn?'🔊 Sound On':'🔇 Sound Off';$('soundToggle').setAttribute('aria-pressed',String(soundOn));if(master)master.gain.value=soundOn?.23:0;if(soundOn)audioReady()};$('spin').onclick=spin;$('restart').onclick=reset;$('again').onclick=reset;$('playerCount').onchange=reset;$('numberCount').onchange=reset;$('changeNumbers').onclick=changeNumbers;$('mode').onchange=reset;$('bet').oninput=updateSpin;
reset();
</script><script src="../audio.js"></script></body></html>
