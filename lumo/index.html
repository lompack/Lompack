<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lompack · Lumo</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b35;color:#f1f9ff;font:16px system-ui,-apple-system,sans-serif;min-height:100dvh}header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}header a{color:#b9f5eb;text-decoration:none}button,select{font:inherit}button{cursor:pointer}main{max-width:560px;margin:auto;padding:5px 14px 25px;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;color:#b4d4df;font-size:13px}.dots{display:flex;gap:7px}.dot{width:12px;height:12px;border-radius:50%;background:#30445e}.dot.on{background:#ffe18d}.stage{position:relative;aspect-ratio:1;background:radial-gradient(circle at 50% 38%,#264f72,#152844 76%);border:2px solid #4a8394;border-radius:24px;overflow:hidden;touch-action:manipulation}.stage svg{width:100%;height:100%;display:block}.stage svg .tap{cursor:pointer;touch-action:manipulation}.hint{font-size:14px;color:#9fb9cc;margin:12px 0;min-height:22px}.reward{position:fixed;inset:0;display:none;place-items:center;background:#101b35dc;z-index:8}.reward.show{display:grid}.reward .star{font-size:105px;animation:pop .7s ease-in-out infinite alternate}.reward .small{font-size:24px;color:#fff3bf}.settings{position:fixed;inset:0;background:#071223e8;z-index:15;display:none;place-items:center;padding:20px}.settings.show{display:grid}.panel{background:#1d3651;border:1px solid #71c9c3;border-radius:20px;padding:23px;width:min(100%,360px);text-align:left}.panel h2{margin:0 0 14px}.panel label{display:block;margin:15px 0}.panel select{width:100%;margin-top:5px;padding:9px;border-radius:9px;background:#10253e;color:white;border:1px solid #639caa}.panel button{background:#ffe08c;border:0;border-radius:10px;padding:12px 20px;font-weight:800}.break{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at center,#215b64,#102c42 75%);display:none;place-items:center;padding:18px;text-align:center}.break.show{display:grid}.break .inner{max-width:500px;width:100%}.break h2{font-size:clamp(30px,7vw,46px);margin:10px}.break .figure{height:240px;display:grid;place-items:center;font-size:135px;animation:hop 1.1s ease-in-out infinite}.break .clock{font-variant-numeric:tabular-nums;font-size:35px;font-weight:800;color:#ffe28e}.break p{color:#c7e5e8}.gear{background:transparent;color:#c9e8e9;border:1px solid #456b81;border-radius:10px;padding:7px 10px}.actions{display:flex;justify-content:center;gap:10px;margin-top:13px}.actions button{border:1px solid #669ba7;border-radius:12px;padding:9px 16px;background:#244c66;color:white}.spark{font-size:24px;letter-spacing:6px;color:#ffe18d}@keyframes pop{from{transform:scale(.8) rotate(-10deg)}to{transform:scale(1.2) rotate(10deg)}}@keyframes hop{0%,100%{transform:translateY(15px) rotate(-5deg)}50%{transform:translateY(-26px) rotate(5deg)}}@media(max-height:740px){.stage{max-height:56dvh;aspect-ratio:1;margin:auto}.break .figure{height:160px;font-size:95px}}
</style></head><body><header><a href="../">← Lompack</a><strong>✦ LUMO</strong><button class="gear" id="gear" aria-label="Adult settings">⚙️</button></header><main><div class="top"><div class="dots" id="dots"></div><span id="sessionClock">05:00</span><span id="stars">✦ 0</span></div><div class="stage" id="stage" aria-label="Interactive puzzle"></div><div class="hint" id="hint">👆</div><div class="actions"><button id="reset" aria-label="Try again">↻</button><button id="sound" aria-label="Toggle sound">♫</button></div></main>
<div class="reward" id="reward"><div><div class="star">⭐</div><div class="small">✨ ✨ ✨</div></div></div>
<div class="settings" id="settings"><div class="panel"><h2>⚙️ For grown-ups</h2><label>Play session<select id="session"><option value="1">1 minute (test)</option><option value="3">3 minutes</option><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="20">20 minutes</option><option value="30">30 minutes</option></select></label><label>Movement break<select id="breakLength"><option value="1">1 minute</option><option value="2">2 minutes</option><option value="3">3 minutes</option><option value="5">5 minutes</option><option value="10">10 minutes</option></select></label><p style="font-size:13px;color:#bfd5df">The play timer starts when you close this panel. A movement break locks the puzzles until its countdown ends. Settings are saved on this device.</p><button id="save">Save & play ✓</button></div></div>
<div class="break" id="breakScreen"><div class="inner"><div style="font-size:32px">🌿 ✨ 🌿</div><h2>Time to move!</h2><div class="figure" id="activityFigure">🏃</div><div style="font-size:24px" id="activityName">🏃 💨</div><p>Come back when the circle is full.</p><svg viewBox="0 0 300 12" style="width:85%;max-width:300px;height:12px"><rect width="300" height="12" rx="6" fill="#ffffff35"/><rect id="progress" width="0" height="12" rx="6" fill="#ffe28e"/></svg><div class="clock" id="breakClock">02:00</div></div></div>
<script>
const $=id=>document.getElementById(id),stage=$('stage');let level=0,stars=0,tries=0,step=0,solved=false,sound=true,audio=null;
const shapes=['circle','square','triangle','diamond'];let sessionMinutes=Number(localStorage.getItem('lumoSession')||5),breakMinutes=Number(localStorage.getItem('lumoBreak')||2),sessionEnd=0,breakEnd=0,activityIndex=0,locked=false;
function tone(freq=500){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.19);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}catch(e){}}
function svg(body){stage.innerHTML='<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg"><defs><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs>'+body+'</svg>'}
function circle(x,y,r,color='#ffe28e'){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+color+'"/>'}
function rect(x,y,w,h,color='#ffe28e'){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8" fill="'+color+'"/>'}
function path(d,color='#ffe28e'){return '<path d="'+d+'" fill="'+color+'"/>'}
function draw(){
 if(locked)return;
 $('dots').innerHTML=Array.from({length:5},(_,i)=>'<i class="dot '+(i===level%5?'on':'')+'"></i>').join('');
 $('stars').textContent='✦ '+stars;
 $('hint').textContent=['👆','↻ 👆','👆 ⏱','👆 ➜','👀 👆'][level%5];
 const n=level%5;
 if(n===0){ // Tap to roll a ball through a gate: first a discovery, then a timing puzzle
 const gate=step%3===2?240:180;
 svg('<path d="M35 105 Q140 120 180 230 T326 267" fill="none" stroke="#67c3c7" stroke-width="15" stroke-linecap="round"/>'+circle(55+step*30,96+step*20,23)+circle(303,267,34,'#193a55')+'<circle cx="303" cy="267" r="25" fill="none" stroke="#8de6c6" stroke-width="7"/>'+rect(gate,182,14,90,'#ff987a')+'<rect class="tap" x="0" y="0" width="360" height="360" fill="transparent"/>');
 }else if(n===1){const a=(step%8)*Math.PI/4;svg('<circle cx="180" cy="175" r="100" fill="none" stroke="#497e94" stroke-width="12" stroke-dasharray="12 14"/><path d="M180 55 L210 105 L150 105 Z" fill="#8de6c6"/><g transform="rotate('+(a*180/Math.PI)+' 180 175)">'+path('M180 120 L220 205 L140 205 Z')+'</g><circle class="tap" cx="180" cy="175" r="125" fill="transparent"/>');}
 else if(n===2){const x=70+step*30;svg('<path d="M35 270 Q180 110 325 270" fill="none" stroke="#649bad" stroke-width="10"/>'+circle(x,270-Math.sin((x-35)/290*Math.PI)*160,23)+circle(298,242,34,'#22455c')+'<circle cx="298" cy="242" r="24" fill="none" stroke="#a5eacb" stroke-width="7"/><rect class="tap" width="360" height="360" fill="transparent"/>');}
 else if(n===3){const p=step%4;svg('<path d="M42 280 H318" stroke="#659da9" stroke-width="9"/>'+circle(75+p*58,250,25)+rect(290,208,40,67,'#6fd0b6')+'<path d="M295 208 V275" stroke="#12384b" stroke-width="9"/><rect class="tap" width="360" height="360" fill="transparent"/>');}
 else{const pos=step%4;svg('<circle cx="180" cy="180" r="105" fill="none" stroke="#3d7c8e" stroke-width="12"/>'+circle(180+105*Math.sin(pos*Math.PI/2),180-105*Math.cos(pos*Math.PI/2),25)+circle(285,180,32,'#1d4659')+'<circle cx="285" cy="180" r="22" fill="none" stroke="#a9eacb" stroke-width="7"/><rect class="tap" width="360" height="360" fill="transparent"/>');}
}
function attempt(){if(locked||solved)return;tries++;step++;tone(320+step*45);const n=level%5;let success=n===0?step>=3:n===1?step%8===2:n===2?step>=7:n===3?step%4===3:step%4===1;
 if(success){solved=true;stars++;tone(850);$('reward').classList.add('show');setTimeout(()=>{if(locked)return;$('reward').classList.remove('show');level++;tries=0;step=0;solved=false;draw()},1050)}
 else{stage.animate([{transform:'translateX(0)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:190});draw()}}
stage.addEventListener('pointerdown',attempt);
$('reset').onclick=()=>{if(locked)return;step=0;tries=0;solved=false;draw()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♫':'♪̸'};
const activities=[{figure:'🏃',name:'🏃 💨',motion:'hop'},{figure:'🤸',name:'🤸 ⬆️ ⬇️',motion:'hop'},{figure:'🕺',name:'🎶 🕺 🎶',motion:'hop'},{figure:'🙆',name:'🙆 ↔️',motion:'hop'},{figure:'🚶',name:'🚶 🌿',motion:'hop'}];
function clock(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startSession(){locked=false;sessionEnd=Date.now()+sessionMinutes*60000;$('breakScreen').classList.remove('show');$('reward').classList.remove('show');draw()}
function beginBreak(){locked=true;breakEnd=Date.now()+breakMinutes*60000;const a=activities[activityIndex++%activities.length];$('activityFigure').textContent=a.figure;$('activityName').textContent=a.name;$('breakScreen').classList.add('show');$('reward').classList.remove('show');$('breakClock').textContent=clock(breakEnd-Date.now())}
function tick(){const now=Date.now();if(!locked&&sessionEnd&&now>=sessionEnd)beginBreak();if(locked){const left=breakEnd-now;$('breakClock').textContent=clock(left);$('progress').setAttribute('width',String(Math.max(0,Math.min(300,300*(1-left/(breakMinutes*60000))))));if(left<=0)startSession()}else $('sessionClock').textContent=clock(sessionEnd-now)}
setInterval(tick,250);
$('session').value=String(sessionMinutes);$('breakLength').value=String(breakMinutes);
$('gear').onclick=()=>{if(!locked){$('settings').classList.add('show');sessionEnd=0}};
$('save').onclick=()=>{sessionMinutes=Number($('session').value);breakMinutes=Number($('breakLength').value);localStorage.setItem('lumoSession',sessionMinutes);localStorage.setItem('lumoBreak',breakMinutes);$('settings').classList.remove('show');startSession()};
draw();startSession();
</script></body></html>
