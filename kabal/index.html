<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12513c"><title>Lompack Solitaire</title><style>*{box-sizing:border-box}body{margin:0;background:#12513c;color:white;font:14px system-ui}header{padding:10px;background:#0c3528;display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,button{padding:8px;border:0;border-radius:7px;font-size:14px}main{overflow-x:auto;padding:12px;min-height:85vh}.top,.cols{display:flex;gap:7px;margin-bottom:25px;width:max-content}.pile{width:48px;height:70px;border:1px dashed #a7c9b6;border-radius:6px;position:relative;display:grid;place-items:center}.card{position:absolute;left:0;top:0;width:48px;height:70px;border-radius:6px;background:#fff;color:#111;border:1px solid #aaa;padding:4px;font-weight:bold;font-size:15px;box-shadow:0 1px 2px #0005;touch-action:manipulation}.red{color:#c32735}.back{background:repeating-linear-gradient(45deg,#234eac,#234eac 5px,#426ed1 5px,#426ed1 10px);border:3px solid white}.selected{outline:3px solid #ffdf66;z-index:100!important}.col{width:48px;min-height:70vh;position:relative;border-top:1px dashed #b4d0bd}a{color:white}#celebrate{background:#ffe29a;color:#302310;font-weight:700}.flying-card{position:fixed;left:0;top:0;width:48px;height:70px;display:grid;place-items:center;background:#fff;border:1px solid #aaa;border-radius:6px;box-shadow:0 5px 16px #0007;font-size:17px;font-weight:bold;pointer-events:none;z-index:9999;transform-style:preserve-3d;will-change:transform,opacity}.celebrate-overlay{position:fixed;inset:0;pointer-events:none;z-index:9998;perspective:800px;overflow:hidden} .pickup-screen{position:fixed;inset:0;z-index:10020;background:#12513c;overflow:hidden}.pickup-prompt{position:absolute;z-index:10050;top:20%;left:50%;transform:translateX(-50%);background:#0b3529;padding:24px;border-radius:16px;text-align:center;box-shadow:0 10px 45px #0009;width:min(90vw,330px)}.pickup-prompt h2{margin:0 0 20px}.pickup-prompt button{margin:5px;padding:12px 22px}.pickup-card{position:absolute;width:48px;height:70px;background:white;border:1px solid #aaa;border-radius:6px;display:grid;place-items:center;font-weight:bold;font-size:16px;box-shadow:0 2px 6px #0008;touch-action:manipulation;transition:transform .48s ease-in,opacity .48s ease-in}.pickup-card:focus{outline:3px solid #ffd66b}.pickup-stack{position:absolute;bottom:22px;right:22px;width:64px;height:90px;border:2px dashed #a9d6bd;border-radius:7px;display:grid;place-items:center;font-size:11px;text-align:center;z-index:10040;pointer-events:none}.pickup-stack .stack-layer{position:absolute;width:48px;height:70px;border:2px solid #fff;border-radius:5px;background:repeating-linear-gradient(45deg,#234eac,#234eac 5px,#426ed1 5px,#426ed1 10px)}.pickup-counter{position:absolute;top:15px;left:15px;font-weight:bold;z-index:10040}.pickup-close{position:absolute;top:12px;right:12px;z-index:10045} </style></head><body><header><a href="../">← Lompack</a><label>Decks <select id="decks"><option>1</option><option>2</option><option>3</option></select></label><label>Columns <select id="columns"></select></label><label>Draw <select id="draw"></select></label><button id="new">New Game</button><span id="status"></span></header><main><div class="top"><div class="pile" id="stock"></div><div class="pile" id="waste"></div><div style="width:12px"></div><div id="foundations" style="display:flex;gap:7px"></div></div><div class="cols" id="tableau"></div></main><script>
const suits=['♠','♥','♣','♦'];const red=s=>s===1||s===2;let cols=[],stock=[],waste=[],found=[],sel=null,won=false;const $=id=>document.getElementById(id);
for(let n=1;n<=12;n++)$('columns').add(new Option(n,n));$('columns').value='7';for(let n=1;n<=5;n++)$('draw').add(new Option(n,n));$('draw').value='3';
function make(){let a=[];for(let d=0;d<+$('decks').value;d++)for(let s=0;s<4;s++)for(let v=1;v<=13;v++)a.push({s,v,up:false,id:d+'-'+s+'-'+v});for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){closePickup();stopCelebration();let a=make(),n=+$('columns').value;cols=Array.from({length:n},()=>[]);for(let i=0;i<n;i++)for(let j=0;j<=i;j++){if(!a.length)break;let c=a.pop();c.up=j===i;cols[i].push(c)}stock=a;waste=[];found=Array.from({length:4*(+$('decks').value)},()=>[]);sel=null;won=false;stopCelebration();render()}
function el(tag,cls,parent){let x=document.createElement(tag);x.className=cls||'';parent.appendChild(x);return x}
function card(c,parent,y,fn){let e=el('div','card'+(red(c.s)?' red':'')+(!c.up?' back':''),parent);e.style.top=y+'px';if(c.up)e.textContent=({1:'A',11:'J',12:'Q',13:'K'}[c.v]||c.v)+suits[c.s];e.onclick=ev=>{ev.stopPropagation();fn()};return e}
function pick(type,i,j){if(sel&&move(type,i)){sel=null;render();return}if(type==='col'&&cols[i][j]?.up)sel={type,i,j};else if(type==='waste'&&waste.length)sel={type};else if(type==='found'&&found[i].length)sel={type,i};else sel=null;render()}
function source(){if(!sel)return[];return sel.type==='col'?cols[sel.i].slice(sel.j):sel.type==='waste'?[waste.at(-1)]:[found[sel.i].at(-1)]}
function move(type,i){if(!sel)return false;let a=source();if(!a.length)return false;let c=a[0],dest=type==='col'?cols[i]:found[i];if(sel.type===type&&sel.i===i)return false;
if(type==='found'){if(a.length!==1||!(dest.length?dest.at(-1).s===c.s&&dest.at(-1).v+1===c.v:c.v===1))return false}
else {let last=dest.at(-1);if(last?last.v!==c.v+1||red(last.s)===red(c.s):c.v!==13)return false}
if(sel.type==='col'){cols[sel.i].splice(sel.j);let t=cols[sel.i].at(-1);if(t)t.up=true}else if(sel.type==='waste')waste.pop();else found[sel.i].pop();dest.push(...a);return true}
function render(){let fs=$('foundations'),tb=$('tableau');fs.replaceChildren();tb.replaceChildren();$('stock').replaceChildren();$('waste').replaceChildren();$('stock').onclick=draw;if(stock.length)card({up:false,s:0},$('stock'),0,draw);if(waste.length){let e=card(waste.at(-1),$('waste'),0,()=>pick('waste'));if(sel?.type==='waste')e.classList.add('selected')}
found.forEach((pile,i)=>{let p=el('div','pile',fs);p.onclick=()=>pick('found',i);if(pile.length){let e=card(pile.at(-1),p,0,()=>pick('found',i));if(sel?.type==='found'&&sel.i===i)e.classList.add('selected')}else p.textContent='A'});
cols.forEach((pile,i)=>{let p=el('div','col',tb);p.onclick=()=>pick('col',i);let y=0;pile.forEach((c,j)=>{let e=card(c,p,y,()=>pick('col',i,j));if(sel?.type==='col'&&sel.i===i&&j>=sel.j)e.classList.add('selected');y+=c.up?26:15});p.style.minHeight=Math.max(350,y+70)+'px'});
$('status').textContent=found.reduce((n,p)=>n+p.length,0)+' / '+52*(+$('decks').value);if(found.every(p=>p.length===13)){ $('status').textContent='🎉 You won!';if(!won){won=true;setTimeout(()=>startCelebration(),350)}}}
function draw(){sel=null;if(stock.length){let n=+$('draw').value;while(n--&&stock.length){let c=stock.pop();c.up=true;waste.push(c)}}else if(waste.length){stock=waste.reverse();stock.forEach(c=>c.up=false);waste=[]}render()}
$('new').onclick=init;$('decks').onchange=init;$('columns').onchange=init;

/* Lompack victory: 3D card physics + seven-voice sine synthesizer */
let audioCtx=null,celebration=null,voices=[],frameId=0,wetBus=null,reverbInput=null,reverbNodes=[],reverbOutput=null,hiddenFoundationCards=[],pickupScreen=null,complimentIndex=0;
function makeReverb(){
 if(!audioCtx)return;
 // Feedback delay network: lush long tail, no additional oscillators.
 const input=audioCtx.createGain(),output=audioCtx.createGain();
 input.gain.value=.65;output.gain.value=.46;
 const delays=[.277,.359,.443,.557],filters=[2700,3100,3500,3900];
 const network=delays.map((d,i)=>{const delay=audioCtx.createDelay(2),feedback=audioCtx.createGain(),low=audioCtx.createBiquadFilter(),tap=audioCtx.createGain();delay.delayTime.value=d;feedback.gain.value=Math.pow(0.001,d/10);low.type='lowpass';low.frequency.value=filters[i];tap.gain.value=.24;input.connect(delay);delay.connect(low);low.connect(feedback);feedback.connect(delay);low.connect(tap);tap.connect(output);return {delay,feedback,low,tap}});
 output.connect(audioCtx.destination);wetBus=input;reverbInput=input;reverbOutput=output;reverbNodes=network;
}
function removeReverb(){
 if(reverbOutput){try{reverbOutput.disconnect()}catch(e){}}
 if(reverbInput){try{reverbInput.disconnect();reverbNodes.forEach(n=>{n.delay.disconnect();n.feedback.disconnect();n.low.disconnect();n.tap.disconnect()})}catch(e){}}
 wetBus=null;reverbInput=null;reverbOutput=null;reverbNodes=[];
}
function silenceVictory(){
 if(!audioCtx)return;
 const t=audioCtx.currentTime;
 voices.forEach(v=>{try{v.gain.gain.cancelScheduledValues(t);v.gain.gain.setTargetAtTime(0,t,.025);v.osc.stop(t+.2)}catch(e){}});
 voices=[];
 // Disconnect the output immediately: no accumulated feedback tail reaches speakers.
 removeReverb();
}
function stopCelebration(){
 hiddenFoundationCards.forEach(e=>e.style.visibility='');hiddenFoundationCards=[];
 cancelAnimationFrame(frameId);
 if(celebration){celebration.remove();celebration=null}
 silenceVictory();
}

function startCelebration(){
 closePickup();stopCelebration();
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){audioCtx=null}
 if(audioCtx)makeReverb();
 const overlay=document.createElement('div');overlay.className='celebrate-overlay';document.body.appendChild(overlay);celebration=overlay;
 const count=+$('decks').value*52,particles=[],launchInterval=57000/Math.max(1,(+$('decks').value*52)-1),started=performance.now();
 const foundationPiles=[...document.querySelectorAll('#foundations .pile')];
 const pool=[];
 // Each foundation is a complete temporary visual stack, K through A.
 // This also makes Test seier work without changing the real game state.
 foundationPiles.forEach((pile,i)=>{
   const rect=pile.getBoundingClientRect(),suit=i%4;
   const visible=pile.querySelector('.card');if(visible){visible.style.visibility='hidden';hiddenFoundationCards.push(visible)}
   const stack=[];
   for(let v=1;v<=13;v++){
     const ghost=document.createElement('div');ghost.className='flying-card';
     ghost.style.color=red(suit)?'#c32735':'#151515';
     ghost.textContent=({1:'A',11:'J',12:'Q',13:'K'}[v]||v)+suits[suit];
     ghost.style.transform='translate3d('+(rect.left)+'px,'+(rect.top)+'px,0)';
     ghost.style.zIndex=100+v;
     overlay.appendChild(ghost);stack.push(ghost);
   }
   for(let v=13;v>=1;v--)pool.push({s:suit,v,node:stack[v-1],x:rect.left+24,y:rect.top+35});
 });
 const kingX=foundationPiles.length?foundationPiles[0].getBoundingClientRect().left+24:innerWidth/2;
 const kingY=foundationPiles.length?foundationPiles[0].getBoundingClientRect().top+35:innerHeight*.4;
 // Interleave foundation piles, one rank at a time: all kings, then queens ... aces.
 pool.sort((a,b)=>b.v-a.v);
 let launched=0;
 function spawn(now){
  const c=pool[launched++],node=c.node;
  node.style.zIndex=999;
  const angle=Math.random()*Math.PI*2, speed=35+Math.random()*130;
  const p={node,x:c.x,y:c.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-130,ax:(Math.random()-.5)*22,gravity:18+Math.random()*48,rot:[0,0,0],spin:Array.from({length:3},()=>(Math.random()-.5)*900),born:now,life:5+Math.random()*4,voice:null};
  if(audioCtx&&voices.length<7){
   try{
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),pan=audioCtx.createStereoPanner?.();
    osc.type='sine';gain.gain.value=0;osc.connect(gain);
    if(pan){gain.connect(pan);pan.connect(audioCtx.destination);if(wetBus)pan.connect(wetBus)}else{gain.connect(audioCtx.destination);if(wetBus)gain.connect(wetBus)}
    osc.frequency.value=250;osc.start();
    const v={osc,gain,pan,p};voices.push(v);p.voice=v;
    gain.gain.setTargetAtTime(.045,audioCtx.currentTime,.025);
   }catch(e){}
  }
  particles.push(p);
 }
 let previous=started;
 function animate(now){
  if(celebration!==overlay)return;
  const dt=Math.min(.045,(now-previous)/1000);previous=now;
  while(launched<count&&now-started>=launched*launchInterval)spawn(now);
  for(let i=particles.length-1;i>=0;i--){
   const p=particles[i],age=(now-p.born)/1000;
   p.vx+=p.ax*dt;p.vy+=p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
   p.rot=p.rot.map((r,j)=>r+p.spin[j]*dt);
   p.node.style.transform='translate3d('+(p.x-24)+'px,'+(p.y-35)+'px,0) rotateX('+p.rot[0]+'deg) rotateY('+p.rot[1]+'deg) rotateZ('+p.rot[2]+'deg)';
   p.node.style.opacity=Math.max(0,Math.min(1,(p.life-age)*2));
   if(p.voice&&audioCtx){
    const v=p.voice,t=audioCtx.currentTime;
    // 250 Hz at the king position; vertical trajectory dominates pitch,
    // horizontal motion adds a small bend and stereo pan.
    const semitones=Math.max(-30,Math.min(30,(kingY-p.y)/42+(p.x-kingX)/260));
    const hz=Math.max(45,Math.min(1600,250*Math.pow(2,semitones/12)));
    v.osc.frequency.setTargetAtTime(hz,t,.045);
    if(v.pan)v.pan.pan.setTargetAtTime(Math.max(-1,Math.min(1,(p.x-innerWidth/2)/(innerWidth/2))),t,.05);
    if(age>p.life-.35)v.gain.gain.setTargetAtTime(0,t,.08);
   }
   if(age>p.life||p.x< -180||p.x>innerWidth+180||p.y>innerHeight+180||p.y< -240){
    if(p.voice){const v=p.voice;voices=voices.filter(q=>q!==v);try{v.gain.gain.setTargetAtTime(0,audioCtx.currentTime,.018);v.osc.stop(audioCtx.currentTime+.12)}catch(e){}}
    p.node.remove();particles.splice(i,1);
   }
  }
  if(launched<count||particles.length)frameId=requestAnimationFrame(animate);
  else{overlay.remove();if(celebration===overlay){celebration=null;showPickupPrompt()}hiddenFoundationCards.forEach(e=>e.style.visibility='');hiddenFoundationCards=[]}
 }
 frameId=requestAnimationFrame(animate);
}

function closePickup(){if(pickupScreen){pickupScreen.remove();pickupScreen=null}}
function showPickupPrompt(){
 silenceVictory();
 closePickup();
 const screen=document.createElement('div');screen.className='pickup-screen';document.body.appendChild(screen);pickupScreen=screen;
 const prompt=document.createElement('div');prompt.className='pickup-prompt';
 prompt.innerHTML='<h2>Pick up the cards?</h2>';
 const yes=document.createElement('button');yes.textContent='Yes';
 const no=document.createElement('button');no.textContent='No';
 prompt.append(yes,no);screen.appendChild(prompt);
 no.onclick=()=>closePickup();
 yes.onclick=()=>{prompt.remove();beginPickup(screen)};
}
function beginPickup(screen){
 const total=52*(+$('decks').value),cards=[];
 const counter=document.createElement('div');counter.className='pickup-counter';screen.appendChild(counter);
 const close=document.createElement('button');close.className='pickup-close';close.textContent='✕';close.onclick=closePickup;screen.appendChild(close);
 const stack=document.createElement('div');stack.className='pickup-stack';stack.textContent='Collected cards';screen.appendChild(stack);
 const bounds=()=>({w:window.innerWidth,h:window.innerHeight});
 let picked=0;counter.textContent='0 / '+total;
 // Make overlapping cards across the visible table; tapping a visible card collects it.
 for(let d=0;d<+$('decks').value;d++)for(let suit=0;suit<4;suit++)for(let v=1;v<=13;v++){
  const card=document.createElement('button');card.className='pickup-card';
  card.textContent=({1:'A',11:'J',12:'Q',13:'K'}[v]||v)+suits[suit];
  card.style.color=red(suit)?'#c32735':'#111';
  const {w,h}=bounds(),x=12+Math.random()*Math.max(1,w-85),y=70+Math.random()*Math.max(1,h-220);
  const angle=(Math.random()-.5)*150;
  card.style.left=x+'px';card.style.top=y+'px';card.style.transform='rotate('+angle+'deg)';
  card.style.zIndex=String(10+cards.length);
  card.setAttribute('aria-label','Pick up '+card.textContent);
  card.onclick=()=>{
   if(card.disabled)return;card.disabled=true;
   // Collected cards visibly grow into a deck, one layer for each pickup.
   const layer=document.createElement('div');layer.className='stack-layer';
   const offset=Math.min(15,Math.floor(picked/8));
   layer.style.transform='translate('+(offset*.3)+'px,'+(-offset*.7)+'px)';
   layer.style.zIndex=String(picked+1);stack.appendChild(layer);
   picked++;counter.textContent=picked+' / '+total;
   const target=stack.getBoundingClientRect();
   const dx=target.left+target.width/2-(x+24),dy=target.top+target.height/2-(y+35);
   card.style.zIndex='10039';card.style.pointerEvents='none';
   card.style.transform='translate('+dx+'px,'+dy+'px) rotate(0deg) scale(.85)';
   card.style.opacity='0';
   setTimeout(()=>card.remove(),500);
   if(picked===total){const greetings=['You are amazing! ✨','Well done! 🌟','Fabulous work! 💫','Wow, fantastic! 🎉','Brilliant job! 👏','Absolutely wonderful! 💛','You did it! 🏆','That was impressive! ⭐','Beautifully done! 🌈','You are a superstar! 🌟'];const greeting=greetings[complimentIndex++%greetings.length];counter.textContent='All cards collected!';const msg=document.createElement('div');msg.className='pickup-prompt';msg.innerHTML='<h2>'+greeting+'</h2><p>All cards picked up. Thank you!</p>';const done=document.createElement('button');done.textContent='New game';done.onclick=init;msg.appendChild(done);setTimeout(()=>{if(pickupScreen===screen)screen.appendChild(msg)},550)}
  };
  screen.appendChild(card);cards.push(card);
 }
}


init();

</script></body></html>
